<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unité 5 · Systèmes d’équations — Unit 5 · Systems of Equations</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700;800&family=Noto+Serif:ital,wght@0,400;0,600;1,400&display=swap">
<style>/* Thème sobre inspiré de KDE Breeze (clair) */
:root {
  --bg: #eff0f1;
  --card: #fcfcfc;
  --line: #bdc3c7;
  --line2: #dfe2e4;
  --text: #232627;
  --muted: #555c60;
  --acc: #3daee9;
  --acc-d: #2980b9;
  --acc-bg: #e4f3fb;
  --ok: #1e7b45;
  --ok-bg: #e7f5ec;
  --err: #b0281d;
  --err-bg: #fbeceb;
  --info-bg: #fff8e0;
  --e1: #0072b2;
  --e2: #b34700;
  --r: 4px;
}
* { box-sizing: border-box; }
html { font-size: 17px; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Noto Sans', 'Segoe UI', system-ui, -apple-system, sans-serif; line-height: 1.55; }
.app.big { font-size: 1.18rem; }
button { font: inherit; color: inherit; }
h1, h2, h3, h4 { line-height: 1.25; margin: 0; }
p { margin: 0.35em 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }

/* barre du haut */
.top { position: sticky; top: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 8px 16px; background: var(--card); border-bottom: 1px solid var(--line); }
.top-t { display: flex; align-items: center; gap: 10px; }
.top h1 { font-size: 1.05em; font-weight: 700; }
.top p { margin: 0; font-size: 0.82em; color: var(--muted); }
.top-c { display: flex; gap: 10px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--card); }
.seg button { border: 0; background: transparent; min-width: 44px; min-height: 40px; padding: 0 12px; cursor: pointer; font-weight: 600; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--acc-d); color: #fff; }
.seg button:hover:not(.on) { background: var(--acc-bg); }

.body { display: grid; grid-template-columns: 270px 1fr; min-height: calc(100vh - 58px); }
.side { background: #f7f7f8; border-right: 1px solid var(--line); padding: 10px 8px; }
.side ul { list-style: none; margin: 0; padding: 0; position: sticky; top: 70px; }
.side button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 6px 10px; border: 1px solid transparent; border-radius: var(--r); background: transparent; text-align: left; cursor: pointer; }
.side button:hover { background: var(--acc-bg); border-color: #b9e0f5; }
.side button.on { background: var(--acc); color: #fff; border-color: var(--acc-d); }
.nk { flex: 0 0 26px; height: 26px; display: inline-grid; place-items: center; border-radius: 50%; background: var(--line2); font-weight: 700; font-size: 0.85em; color: var(--text); }
.side button.on .nk { background: #fff; color: var(--acc-d); }
.nt { flex: 1; font-size: 0.93em; }
.np { font-size: 0.78em; color: var(--muted); font-variant-numeric: tabular-nums; }
.np.full { color: var(--ok); font-weight: 700; }
.side button.on .np { color: #fff; }
.mobnav { display: none; }
main { padding: 22px clamp(12px, 3vw, 36px) 40px; max-width: 1180px; outline: none; }

@media (max-width: 880px) {
  .body { grid-template-columns: 1fr; }
  .side { display: none; }
  .mobnav { display: block; padding: 10px 12px 0; }
  .mobnav select { width: 100%; min-height: 46px; font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); }
}

/* page */
.page-h { margin-bottom: 16px; }
.kicker { text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.78em; font-weight: 700; color: var(--acc-d); }
.page-h h2 { font-size: 1.55em; margin-top: 2px; }
.intro { color: var(--muted); max-width: 70ch; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 16px 18px; margin: 14px 0; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05); }
.card-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.card-h h3 { font-size: 1.12em; }
.card h3 { margin-bottom: 6px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.two > .card, .two > .memo { margin: 0; }
.three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.three .card { margin: 0; }
@media (max-width: 760px) { .two, .three { grid-template-columns: 1fr; } }
.center { text-align: center; margin: 8px 0; }
.muted { color: var(--muted); }
.cap { color: var(--muted); font-size: 0.88em; text-align: center; margin-top: 4px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; }

/* boutons Breeze */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 6px 16px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); cursor: pointer; font-weight: 600; box-shadow: 0 1px 1px rgba(0, 0, 0, 0.06); }
.btn:hover:not(:disabled) { border-color: var(--acc); background: var(--acc-bg); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.primary { background: var(--acc-d); border-color: #1f6e9e; color: #fff; }
.btn.primary:hover:not(:disabled) { background: #2471a3; }
.btn.sm { min-height: 36px; padding: 4px 12px; font-size: 0.88em; }
.btn.sq { min-width: 48px; min-height: 48px; padding: 0; font-size: 1.4em; line-height: 1; }
.cnt { opacity: 0.85; font-weight: 400; font-size: 0.85em; }

/* badges */
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 12px; font-size: 0.78em; font-weight: 700; border: 1px solid; }
.bw { background: #e8f4ea; color: var(--ok); border-color: #b7dcc3; }
.bq { background: var(--acc-bg); color: #1d5f8a; border-color: #b9e0f5; }
.bg { background: #f1f2f3; color: var(--muted); border-color: var(--line); }
.lv { background: #f4f1f8; color: #5b2c83; border-color: #d9cce8; }
.dots { letter-spacing: 1px; }
.donebadge { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; color: var(--ok); font-weight: 700; font-size: 0.9em; }
.qcount { margin-left: auto; color: var(--muted); font-size: 0.88em; }

/* maths */
.m { font-family: 'Noto Serif', Georgia, serif; font-size: 1.08em; white-space: pre; display: inline; }
.m .v { font-style: italic; padding: 0 0.04em; }
.m .mw { font-family: 'Noto Sans', system-ui, sans-serif; font-size: 0.9em; padding: 0 0.15em; }
.m.e1 { color: var(--e1); font-weight: 600; }
.m.e2 { color: var(--e2); font-weight: 600; }
.mbig { font-size: 1.3em; }
.frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; font-size: 0.8em; line-height: 1.12; margin: 0 0.1em; }
.frac .fn { border-bottom: 1.6px solid currentColor; padding: 0 0.15em; }
.etag { vertical-align: middle; display: inline-grid; place-items: center; width: 1.45em; height: 1.45em; border-radius: 50%; font-family: 'Noto Sans', sans-serif; font-style: normal; font-size: 0.72em; font-weight: 700; margin-right: 0.45em; border: 2px solid; }
.et1 { color: var(--e1); border-style: solid; }
.et2 { color: var(--e2); border-style: dashed; }
.sys { display: inline-flex; align-items: stretch; gap: 0.45em; margin: 0.3em 0.2em; vertical-align: middle; }
.sys-br { width: 0.55em; border: 2.5px solid var(--text); border-right: 0; border-radius: 0.6em 0 0 0.6em; }
.sys-l { display: flex; flex-direction: column; gap: 0.3em; padding: 0.15em 0; }
.sys-l > .m { display: block; }
.sysbig { font-size: 1.2em; }
.kterm b { font-weight: 700; }
.k2 { color: var(--muted); font-size: 0.88em; }

/* lecture audio */
.readable { position: relative; }
.readable-body { padding-right: 44px; }
.say { position: absolute; top: 0; right: 0; width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); color: var(--acc-d); cursor: pointer; }
.say:hover { background: var(--acc-bg); border-color: var(--acc); }
.say.inline { position: static; width: 34px; height: 34px; }
.stmt { background: #f6f8f9; border: 1px solid var(--line2); border-radius: var(--r); padding: 12px 14px; margin: 6px 0 12px; font-size: 1.02em; }
.stmt .say { top: 6px; right: 6px; }

/* fiche mémo */
.memo { background: #fffdf3; border: 1px solid #e8dca6; border-left: 5px solid #d4a017; border-radius: 6px; padding: 12px 16px; margin: 14px 0; }
.memo header { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.memo h3 { font-size: 1.02em; color: #6d5200; }
.memo ol { margin: 0.2em 0; padding-left: 1.3em; }
.memo-hidden { color: var(--muted); font-style: italic; min-height: 3em; }

/* chips d'étapes */
.chip { display: inline-flex; flex-direction: column; align-items: flex-start; padding: 3px 9px; border-radius: 4px; font-size: 0.82em; font-weight: 700; line-height: 1.15; border: 1px solid; min-width: 92px; }
.chip small { font-weight: 400; font-size: 0.8em; opacity: 0.85; }
.c-iso { background: #f3eaf8; color: #6c3483; border-color: #dcc6ea; }
.c-sub { background: #fdf0dc; color: #8a4b00; border-color: #f0d3a6; }
.c-sol { background: #e2f4f1; color: #0e6655; border-color: #b3e0d7; }
.c-plug { background: #e4f0fb; color: #1a5c8c; border-color: #bcd9f1; }
.c-check { background: var(--ok-bg); color: var(--ok); border-color: #b9dfc7; }
.c-ans { background: #ececec; color: #2c2f30; border-color: #cfd2d4; }
.c-read, .c-graph, .c-cmp, .c-rew, .c-var, .c-eq, .c-calc { background: #eef1f3; color: #34495e; border-color: #d3d9dd; }

/* exemple résolu / correction */
.wbody.withg, .sol.withg { display: grid; grid-template-columns: minmax(260px, 1fr) minmax(280px, 1.15fr); gap: 18px; align-items: start; }
@media (max-width: 980px) { .wbody.withg, .sol.withg { grid-template-columns: 1fr; } }
.wsteps { list-style: none; margin: 0; padding: 0; counter-reset: ws; }
.wsteps li { display: grid; grid-template-columns: 112px 1fr; gap: 10px; padding: 9px 4px; border-bottom: 1px solid var(--line2); }
.wsteps li.cur { background: var(--acc-bg); border-radius: 4px; }
.ws-m { font-size: 1.05em; }
.ws-m > div { margin: 2px 0; }
.ws-say { color: var(--muted); font-size: 0.94em; }
.wg { position: sticky; top: 76px; }
.grid { width: 100%; height: auto; display: block; margin: 0 auto; font-family: 'Noto Sans', system-ui, sans-serif; }
.grid .num { fill: #232627; font-weight: 600; }
.grid .num.hl { fill: #fff; font-weight: 700; }
.grid .axn { font-size: 18px; font-style: italic; font-weight: 700; font-family: 'Noto Serif', serif; fill: #232627; }
.grid .halo { paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; }
.cor { margin-top: 12px; border-top: 2px solid var(--line2); padding-top: 10px; }
.cor h4 { margin-bottom: 6px; color: var(--acc-d); }

/* exercices */
.sech { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 26px 0 4px; border-bottom: 2px solid var(--line); padding-bottom: 4px; }
.sech h3 { font-size: 1.2em; }
.sech span { color: var(--muted); font-size: 0.88em; }
.ex.finished { border-color: #9fd2b2; }
.step { border-left: 4px solid var(--line2); padding: 8px 0 8px 12px; margin: 10px 0; }
.step.active { border-left-color: var(--acc); }
.step.done { border-left-color: #9fd2b2; }
.step-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.step-n { flex: 0 0 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: var(--acc-d); color: #fff; font-weight: 700; font-size: 0.9em; }
.step.done .step-n { background: var(--ok); }
.step-p { font-weight: 600; }
.given { background: #f4f5f6; border: 1px dashed var(--line); border-radius: var(--r); padding: 8px 10px; }
.given-m { margin: 4px 0; font-size: 1.05em; }
.ans-done { display: inline-flex; align-items: center; gap: 8px; color: var(--ok); font-weight: 600; flex-wrap: wrap; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 50px; padding: 8px 12px; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); cursor: pointer; }
.opt:hover:not(:disabled) { border-color: var(--acc); background: var(--acc-bg); }
.opt:disabled { cursor: default; }
.opt-l { flex: 0 0 30px; height: 30px; display: grid; place-items: center; border-radius: 4px; background: var(--line2); font-weight: 700; }
.opt-t { flex: 1; }
.opt-i { flex: 0 0 auto; }
.opt.right { border-color: var(--ok); background: var(--ok-bg); }
.opt.right .opt-l { background: var(--ok); color: #fff; }
.opt.right .opt-i { color: var(--ok); }
.opt.wrong { border-color: var(--err); background: var(--err-bg); opacity: 0.85; }
.opt.wrong .opt-l { background: var(--err); color: #fff; }
.opt.wrong .opt-i { color: var(--err); }
.numlab { display: inline-flex; align-items: center; gap: 8px; }
.nl { font-weight: 600; }
input.num { width: 7.5em; min-height: 46px; padding: 6px 10px; font: inherit; font-size: 1.1em; font-family: 'Noto Serif', serif; border: 1px solid var(--line); border-radius: var(--r); background: #fff; }
input.num:focus { border-color: var(--acc); outline: 3px solid rgba(61, 174, 233, 0.35); outline-offset: 0; }
.hintrow { margin-top: 8px; }
.fb { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border-radius: var(--r); margin-top: 10px; border: 1px solid; }
.fb-i { flex: 0 0 auto; display: grid; place-items: center; margin-top: 2px; }
.fb.ok { background: var(--ok-bg); border-color: #b9dfc7; color: #164f2e; }
.fb.ok .fb-i { color: var(--ok); }
.fb.err { background: var(--err-bg); border-color: #efc2be; color: #6e1a13; }
.fb.err .fb-i { color: var(--err); }
.fb.info { background: var(--info-bg); border-color: #ecd98f; color: #4d3d00; }
.exfoot { border-top: 1px solid var(--line2); padding-top: 10px; }

/* constructeur de droite / lecteur */
.builder { display: grid; grid-template-columns: minmax(260px, 0.9fr) minmax(280px, 1.2fr); gap: 18px; align-items: start; }
@media (max-width: 980px) { .builder { grid-template-columns: 1fr; } }
.b-ctrl { display: flex; flex-direction: column; gap: 10px; }
.b-eq { font-weight: 600; }
.stepper { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 10px; border: 1px solid var(--line2); border-left: 5px solid var(--sc, var(--text)); border-radius: var(--r); background: #fff; }
.st-l { display: flex; flex-direction: column; }
.st-l span { font-weight: 600; }
.st-l small { color: var(--muted); }
.st-c { display: flex; align-items: center; gap: 6px; }
.st-v { min-width: 2.6em; text-align: center; font-size: 1.35em; font-weight: 700; font-variant-numeric: tabular-nums; }
.b-slope { font-size: 1.05em; }
.pad { display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 52px); gap: 4px; justify-content: start; }
.pad .btn { width: 52px; height: 52px; }
.pad-c { border-radius: 50%; border: 2px dashed var(--line); margin: 10px; }
.chk { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.chk input { width: 22px; height: 22px; }
.readout { font-weight: 700; font-size: 1.05em; }
.onlist { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; }
.onlist li { padding: 4px 8px; border-radius: 4px; background: #f4f5f6; color: var(--muted); }
.onlist li.yes { background: var(--ok-bg); color: var(--ok); font-weight: 600; }
.tbl { border-collapse: collapse; width: 100%; max-width: 360px; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { border: 1px solid var(--line2); padding: 4px 10px; text-align: right; }
.tbl th { background: #f4f5f6; }
.tbl tr.currow td { background: var(--acc-bg); }
.tbl tr.eqrow td { background: var(--ok-bg); font-weight: 700; }

/* accueil */
.goals, .how { padding-left: 1.3em; margin: 0.3em 0; }
.goals li, .how li { margin: 4px 0; }
.legend { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.legend li { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.path { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.pathitem { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 6px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); text-align: left; cursor: pointer; }
.pathitem:hover { border-color: var(--acc); background: var(--acc-bg); }
.pathitem.full { border-color: #9fd2b2; background: var(--ok-bg); }
.pi-k { flex: 0 0 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: var(--line2); font-weight: 700; }
.pi-t { flex: 1; }
.pi-p { font-size: 0.85em; color: var(--muted); }
.notes-b { margin-top: 10px; font-size: 0.93em; color: #33393c; }
.notes-b p { margin: 8px 0; }

/* vocabulaire */
.vocab { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.vcard { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
.vrow { display: flex; align-items: center; gap: 8px; min-height: 36px; }
.vrow b { flex: 1; }
.vflag { font-size: 0.72em; font-weight: 700; padding: 2px 6px; border-radius: 3px; background: #e8eef7; color: #23477a; }
.vflag.en { background: #f7ebe8; color: #7a2f23; }
.vcard p { color: var(--muted); font-size: 0.9em; margin-top: 6px; }

/* comprendre */
.chain { display: flex; align-items: stretch; gap: 8px; flex-wrap: wrap; margin: 6px 0 14px; }
.chain-b { flex: 1 1 150px; background: var(--card); border: 1px solid var(--line); border-top: 4px solid var(--acc); border-radius: 6px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
.chain-b span { color: var(--muted); font-size: 0.9em; }
.chain-b.sol { border-top-color: var(--ok); background: var(--ok-bg); }
.chain-op { align-self: center; font-size: 1.6em; font-weight: 700; color: var(--acc-d); }

/* nombre de solutions */
.mini { text-align: center; }
.mini .grid { max-width: 190px; }
.mini h4 { margin: 8px 0 4px; }
.mini p { font-size: 0.92em; }

/* méthode */
.method { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.method li { display: grid; grid-template-columns: 120px 1fr; gap: 10px; align-items: center; }

/* boîte à outils */
.tk { width: 100%; border-collapse: collapse; }
.tk th, .tk td { border: 1px solid var(--line2); padding: 10px 12px; vertical-align: top; text-align: left; }
.tk thead th { background: #f4f5f6; }
.tk tbody th { background: #fafafa; width: 140px; }

/* code secret */
.cards8 { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.c8 { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-height: 120px; padding: 10px 12px 10px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; text-align: left; }
.c8:hover { border-color: var(--acc); }
.c8.on { border: 2px solid var(--acc-d); background: var(--acc-bg); }
.c8.ok { border-color: #9fd2b2; }
.c8k { position: absolute; right: 10px; bottom: 8px; font-size: 1.5em; font-weight: 800; color: #9aa3aa; }
.c8s { display: inline-flex; align-items: center; gap: 4px; color: var(--ok); font-weight: 700; font-size: 0.9em; }
.letters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
.lt { width: 54px; height: 54px; font-size: 1.4em; font-weight: 800; border: 1px solid var(--line); border-radius: 6px; background: var(--card); cursor: pointer; }
.lt.on { background: var(--acc-d); color: #fff; border-color: #1f6e9e; }
.lt:disabled { opacity: 0.4; cursor: default; }
.lt.on:disabled { opacity: 1; }
.slots { display: flex; gap: 8px; margin: 8px 0; }
.slot { width: 54px; height: 60px; display: grid; place-items: center; font-size: 1.6em; font-weight: 800; border-bottom: 4px solid var(--text); background: #f6f8f9; }

/* quiz */
.qend { text-align: center; padding: 10px; }
.score { font-size: 2.2em; font-weight: 800; color: var(--acc-d); }
