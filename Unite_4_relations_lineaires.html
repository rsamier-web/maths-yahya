**\u2462 Utiliser l\u2019\xE9quation :**
\u2022 on conna\xEEt x \u2192 on **multiplie** : y = k \xD7 x ;
\u2022 on conna\xEEt y \u2192 on **divise** : x = y \xF7 k.`,`**\u2460 Find k:** k = {y/x} using a known point (x \u2260 0).

**\u2461 Write the equation:** y = kx (replace k with its value).

**\u2462 Use the equation:**
\u2022 you know x \u2192 **multiply**: y = k \xD7 x;
\u2022 you know y \u2192 **divide**: x = y \xF7 k.`),keep:i("k = {y/x}   \u2192   y = kx   \u2192   remplacer.","k = {y/x}   \u2192   y = kx   \u2192   substitute."),think:i(`O\xF9 toutes les droites de variation directe coupent-elles l\u2019axe des y ? Que signifie le point (0, 0) pour \xAB heures travaill\xE9es / salaire \xBB ?
\u2192 En (0, 0) : 0 heure travaill\xE9e = 0 $ gagn\xE9.`,`Where does EVERY direct variation line cross the y-axis? What does (0, 0) mean for hours worked vs. pay?
\u2192 At (0, 0): 0 hours worked = $0 earned.`)}],fams:[{title:i("Trouver k et \xE9crire l\u2019\xE9quation","Find k and write the equation"),goal:i("\xC0 partir d\u2019un point, d\u2019un tableau ou d\u2019un graphique.","From a point, a table or a graph."),worked:{q:i("y varie directement avec x. Quand x = 4, y = 36. Trouve k et \xE9cris l\u2019\xE9quation.","y varies directly with x. If x = 4, then y = 36. Find k and write the equation."),steps:[{t:i("J\u2019\xE9cris la formule : k = {y/x}","Write the formula: k = {y/x}"),why:i("Dans une variation directe, le quotient y \xF7 x est toujours \xE9gal \xE0 k.","In direct variation, y \xF7 x always equals k.")},{t:i("Je remplace : k = {36/4} = [k:9]","Substitute: k = {36/4} = [k:9]")},{t:i("J\u2019\xE9cris l\u2019\xE9quation : **y = [k:9]x**","Write the equation: **y = [k:9]x**")},{t:i("Je v\xE9rifie avec le point : 9 \xD7 4 = 36 \u2713","Check with the point: 9 \xD7 4 = 36 \u2713")}],reflect:[i("Pourquoi n\u2019y a-t-il pas de \xAB + b \xBB dans l\u2019\xE9quation ?","Why is there no \u201C+ b\u201D in the equation?"),i("Parce qu\u2019une variation directe passe toujours par (0, 0) : b = 0.","Because direct variation always passes through (0, 0): b = 0.")]},ex:[{id:"m1a1",l:0,q:i("y varie directement avec x. Quand x = 12, y = 3. Compl\xE8te les \xE9tapes.","y varies directly with x. If x = 12, then y = 3. Complete the steps."),fields:[T("k = 3 \xF7 \u25A1",[12],i("\u2460 On divise y par x :","\u2460 Divide y by x:")),T("k = \u25A1",[.25],i("\u2461 Valeur de k :","\u2461 Value of k:")),Yt(.25,i("\u2462 \xC9quation :","\u2462 Equation:"))],hint:i("3 \xF7 12 = {3/12}. Simplifie la fraction (divise en haut et en bas par 3).","3 \xF7 12 = {3/12}. Simplify the fraction (divide top and bottom by 3)."),steps:[i("k = {y/x} = {3/12}","k = {y/x} = {3/12}"),i("On simplifie par 3 : k = {1/4} = 0.25","Simplify by 3: k = {1/4} = 0.25"),i("\xC9quation : y = {1/4}x (ou y = 0.25x)","Equation: y = {1/4}x (or y = 0.25x)")]},{id:"m1a2",l:1,q:i("Salle de sport d\u2019Aaron : le tableau montre l\u2019argent gagn\xE9 selon le nombre d\u2019abonnements vendus.","Aaron\u2019s gym: the table shows money earned for each number of memberships sold."),table:Dc,fields:[T("k = \u25A1",[6],i("Valeur de k :","Value of k:")),Yt(6)],hint:i("Choisis une ligne o\xF9 x n\u2019est pas 0, par exemple x = 2 et y = 12.","Pick a row where x is not 0, for example x = 2 and y = 12."),steps:[i("Je prends le point (2, 12) : k = {12/2} = 6","Take the point (2, 12): k = {12/2} = 6"),i("Je v\xE9rifie avec (5, 30) : {30/5} = 6 \u2713 \u2014 le quotient est bien constant.","Check with (5, 30): {30/5} = 6 \u2713 \u2014 the ratio is constant."),i("\xC9quation : y = 6x (6 $ par abonnement).","Equation: y = 6x ($6 per membership).")]},{id:"m1a3",l:2,q:i("Le graphique montre une variation directe. Lis le point marqu\xE9 et trouve k.","The graph shows a direct variation. Read the marked point and find k."),graph:{x:[-1,4],y:[-7,2],s:1,lines:[{m:-2,b:0,c:"m"}],pts:[{x:3,y:-6,c:"p",guide:!0,anchor:"end",dx:-12,dy:-4}],desc:i("Droite passant par (0, 0) et par le point (3, \u22126).","Line through (0, 0) and the point (3, \u22126).")},fields:[T("k = \u25A1",[-2],i("Valeur de k :","Value of k:"),[{j:0,v:2,m:i("Attention au signe : y est n\xE9gatif et x est positif, donc k est n\xE9gatif.","Watch the sign: y is negative and x is positive, so k is negative.")}]),Yt(-2)],hint:i("Le point est (3, \u22126). Calcule {\u22126/3}.","The point is (3, \u22126). Compute {\u22126/3}."),steps:[i("Point lu : x = 3, y = \u22126.","Point read: x = 3, y = \u22126."),i("k = {\u22126/3} = \u22122","k = {\u22126/3} = \u22122"),i("La droite descend : c\u2019est normal que k soit n\xE9gatif. \xC9quation : y = \u22122x.","The line goes down, so k is negative. Equation: y = \u22122x.")]},{id:"m1a4",l:2,q:i("\xC9cris l\u2019\xE9quation de variation directe pour ce tableau.","Write the direct variation equation for this table."),table:{head:["x","y"],rows:[["\u22122","\u22129"],["0","0"],["4","18"]]},fields:[T("k = \u25A1",[4.5],i("Valeur de k :","Value of k:"),[{j:0,v:-4.5,m:i("Attention aux signes : (\u22129) \xF7 (\u22122) est positif.","Watch the signs: (\u22129) \xF7 (\u22122) is positive.")}]),Yt(4.5)],steps:[i("Avec (4, 18) : k = {18/4} = 4.5","Using (4, 18): k = {18/4} = 4.5"),i("V\xE9rification avec (\u22122, \u22129) : {\u22129/\u22122} = 4.5 \u2713 (n\xE9gatif \xF7 n\xE9gatif = positif)","Check with (\u22122, \u22129): {\u22129/\u22122} = 4.5 \u2713 (negative \xF7 negative = positive)"),i("\xC9quation : y = 4.5x","Equation: y = 4.5x")]},{id:"m1a5",l:3,q:i("y varie directement avec x, et y = \u22127.5 quand x = 2.5. Trouve k et l\u2019\xE9quation.","y varies directly with x, and y = \u22127.5 when x = 2.5. Find k and the equation."),fields:[T("k = \u25A1",[-3],i("Valeur de k :","Value of k:")),Yt(-3)],hint:i("7.5 \xF7 2.5 : combien de fois 2.5 dans 7.5 ? Puis pense au signe.","7.5 \xF7 2.5: how many times does 2.5 go into 7.5? Then think about the sign."),steps:[i("k = {\u22127.5/2.5}","k = {\u22127.5/2.5}"),i("2.5 \xD7 3 = 7.5, donc 7.5 \xF7 2.5 = 3. Le signe est n\xE9gatif : k = \u22123.","2.5 \xD7 3 = 7.5, so 7.5 \xF7 2.5 = 3. The sign is negative: k = \u22123."),i("\xC9quation : y = \u22123x. V\xE9rification : \u22123 \xD7 2.5 = \u22127.5 \u2713","Equation: y = \u22123x. Check: \u22123 \xD7 2.5 = \u22127.5 \u2713")]}]},{title:i("Reconna\xEEtre une variation directe","Recognize direct variation"),goal:i("D\xE9cider \xAB oui / non \xBB et justifier.","Decide \u201Cyes / no\u201D and justify."),worked:{q:i("Parmi y = 3x et y = 3x + 2, laquelle est une variation directe ?","Which one is a direct variation: y = 3x or y = 3x + 2?"),graph:{x:[-1,3],y:[-1,9],s:1,ly:2,lines:[{m:3,b:0,c:"p",lab:"y = 3x",lx:2.2,dx:12,dy:10},{m:3,b:2,c:"r",dash:!0,lab:"y = 3x + 2",lx:1.2,anchor:"end",dx:-12}],desc:i("y = 3x passe par (0, 0) ; y = 3x + 2 passe par (0, 2).","y = 3x passes through (0, 0); y = 3x + 2 passes through (0, 2).")},steps:[{t:i("Test de l\u2019origine : pour x = 0, y = 3 \xD7 0 = **0** \u2713 mais y = 3 \xD7 0 + 2 = **2** \u2717","Origin test: for x = 0, y = 3 \xD7 0 = **0** \u2713 but y = 3 \xD7 0 + 2 = **2** \u2717")},{t:i("Test du quotient pour y = 3x + 2 : x = 1 \u2192 y = 5, {5/1} = 5 ; x = 2 \u2192 y = 8, {8/2} = 4. Pas constant \u2717","Ratio test for y = 3x + 2: x = 1 \u2192 y = 5, {5/1} = 5; x = 2 \u2192 y = 8, {8/2} = 4. Not constant \u2717")},{t:i("Conclusion : seule **y = 3x** est une variation directe (k = 3).","Conclusion: only **y = 3x** is a direct variation (k = 3).")}],reflect:[i("Le \xAB + 2 \xBB change-t-il la pente ?","Does the \u201C+ 2\u201D change the slope?"),i("Non : les deux droites ont la pente 3 (elles sont parall\xE8les). Le \xAB + 2 \xBB les fait seulement monter, et elles ne passent plus par (0, 0).","No: both lines have slope 3 (they are parallel). The \u201C+ 2\u201D only moves the line up, so it no longer passes through (0, 0).")]},ex:[{id:"m1b1",l:1,q:i("y = \u22125x est-elle une variation directe ?","Is y = \u22125x a direct variation?"),fields:[M(Ge,0),T("k = \u25A1",[-5],i("Si oui, k =","If yes, k ="))],steps:[i("La forme est y = kx, sans \xAB + b \xBB.","The form is y = kx, with no \u201C+ b\u201D."),i("Oui, c\u2019est une variation directe, avec k = \u22125 (la droite descend).","Yes, it is a direct variation, with k = \u22125 (the line goes down).")]},{id:"m1b2",l:1,q:i("y = 4x \u2212 1 est-elle une variation directe ?","Is y = 4x \u2212 1 a direct variation?"),fields:[M(Ge,1)],steps:[i("Pour x = 0 : y = 4 \xD7 0 \u2212 1 = \u22121.","For x = 0: y = 4 \xD7 0 \u2212 1 = \u22121."),i("La droite ne passe pas par (0, 0) (b = \u22121 \u2260 0) : ce n\u2019est **pas** une variation directe.","The line does not pass through (0, 0) (b = \u22121 \u2260 0): **not** a direct variation.")]},{id:"m1b3",l:2,q:i("Ce tableau repr\xE9sente-t-il une variation directe ?","Does this table show a direct variation?"),table:{head:["x","1","2","3"],rows:[["y","4","8","13"]],rowHead:!0},fields:[M(Ge,1)],hint:i("Calcule {y/x} pour chaque colonne.","Compute {y/x} for each column."),steps:[i("{4/1} = 4 ; {8/2} = 4 ; {13/3} \u2248 4.33","{4/1} = 4; {8/2} = 4; {13/3} \u2248 4.33"),i("Le quotient n\u2019est pas toujours le m\xEAme : **non**, ce n\u2019est pas une variation directe.","The ratio is not always the same: **no**, not a direct variation.")]},{id:"m1b4",l:2,q:i("Ce tableau repr\xE9sente-t-il une variation directe ? Si oui, donne k.","Does this table show a direct variation? If yes, give k."),table:{head:["x","\u22123","2","5"],rows:[["y","\u22126","4","10"]],rowHead:!0},fields:[M(Ge,0),T("k = \u25A1",[2],i("k =","k ="))],steps:[i("{\u22126/\u22123} = 2 ; {4/2} = 2 ; {10/5} = 2","{\u22126/\u22123} = 2; {4/2} = 2; {10/5} = 2"),i("Le quotient est constant : **oui**, k = 2, et y = 2x.","The ratio is constant: **yes**, k = 2, and y = 2x.")]},{id:"m1b5",l:3,q:i("L\u2019\xE9quation 2y = 7x est-elle une variation directe ? Si oui, donne k.","Is 2y = 7x a direct variation? If yes, give k."),fields:[M(Ge,0),T("k = \u25A1",[3.5],i("k =","k ="))],hint:i("Isole y : divise les deux membres par 2.","Isolate y: divide both sides by 2."),steps:[i("On divise les deux membres par 2 : y = {7/2}x","Divide both sides by 2: y = {7/2}x"),i("C\u2019est de la forme y = kx : **oui**, k = {7/2} = 3.5.","It has the form y = kx: **yes**, k = {7/2} = 3.5.")]},{id:"m1b6",l:3,q:i("L\u2019\xE9quation y \u2212 3 = 2x est-elle une variation directe ?","Is y \u2212 3 = 2x a direct variation?"),fields:[M(Ge,1)],steps:[i("On isole y : on ajoute 3 des deux c\xF4t\xE9s \u2192 y = 2x + 3.","Isolate y: add 3 to both sides \u2192 y = 2x + 3."),i("b = 3 \u2260 0 : la droite passe par (0, 3) et non par (0, 0). **Non.**","b = 3 \u2260 0: the line passes through (0, 3), not (0, 0). **No.**")]}]},{title:i("Calculer une valeur manquante","Find a missing value"),goal:i("Utiliser y = kx dans des situations concr\xE8tes.","Use y = kx in real-world situations."),worked:{q:i("Une bille roule 10.5 cm en 3 secondes. La distance y varie directement avec le temps x. Combien de temps faut-il pour rouler 56 cm ?","A marble rolls 10.5 cm in 3 seconds. Distance y varies directly with time x. How long does it take to roll 56 cm?"),steps:[{t:i("Je trouve k : k = {10.5/3} = 3.5 cm par seconde.","Find k: k = {10.5/3} = 3.5 cm per second."),why:i("k est la vitesse : la distance parcourue en 1 seconde.","k is the speed: distance rolled in 1 second.")},{t:i("J\u2019\xE9cris l\u2019\xE9quation : y = 3.5x","Write the equation: y = 3.5x")},{t:i("On conna\xEEt y = 56 : 56 = 3.5x","We know y = 56: 56 = 3.5x")},{t:i("Je divise par 3.5 : x = {56/3.5} = **16 secondes**","Divide by 3.5: x = {56/3.5} = **16 seconds**"),why:i("x est multipli\xE9 par 3.5 ; l\u2019op\xE9ration inverse est la division.","x is multiplied by 3.5; the inverse operation is division.")},{t:i("Je v\xE9rifie : 3.5 \xD7 16 = 56 \u2713","Check: 3.5 \xD7 16 = 56 \u2713")}],reflect:[i("Si on cherche y, on multiplie ; si on cherche x, on\u2026 ?","To find y we multiply; to find x we\u2026?"),i("\u2026divise par k.","\u2026divide by k.")]},ex:[{id:"m1c1",l:0,q:i("Aaron gagne y = 6x dollars (x = nombre d\u2019abonnements). Combien gagne-t-il en vendant 13 abonnements ?","Aaron earns y = 6x dollars (x = memberships). How much does he earn selling 13 memberships?"),fields:[T("y = 6 \xD7 \u25A1",[13],i("\u2460 Je remplace x :","\u2460 Substitute x:")),T("y = \u25A1 $",[78],i("\u2461 Je calcule :","\u2461 Calculate:"))],steps:[i("On conna\xEEt x = 13, on cherche y : on multiplie.","We know x = 13 and want y: multiply."),i("y = 6 \xD7 13 = 78. Aaron gagne 78 $.","y = 6 \xD7 13 = 78. Aaron earns $78.")]},{id:"m1c2",l:1,q:i("Aaron a gagn\xE9 108 $ (y = 6x). Combien d\u2019abonnements a-t-il vendus ?","Aaron earned $108 (y = 6x). How many memberships did he sell?"),fields:[T("x = \u25A1",[18],i("Nombre d\u2019abonnements :","Memberships:"),[{j:0,v:648,m:i("Ici on conna\xEEt y (108) : il faut diviser par 6, pas multiplier.","Here we know y (108): divide by 6, don\u2019t multiply.")}])],steps:[i("On conna\xEEt y = 108 : 108 = 6x","We know y = 108: 108 = 6x"),i("On divise par 6 : x = {108/6} = 18 abonnements.","Divide by 6: x = {108/6} = 18 memberships.")]},{id:"m1c3",l:2,q:i("y varie directement avec x. Si x = 4, alors y = 36 (donc y = 9x).","y varies directly with x. If x = 4, then y = 36 (so y = 9x)."),fields:[T("x = \u25A1",[16],i("a. Valeur de x quand y = 144 :","a. Value of x when y = 144:")),T("y = \u25A1",[243],i("b. Valeur de y quand x = 27 :","b. Value of y when x = 27:"))],steps:[i("a. 144 = 9x \u2192 x = {144/9} = 16","a. 144 = 9x \u2192 x = {144/9} = 16"),i("b. y = 9 \xD7 27 = 243","b. y = 9 \xD7 27 = 243")]},{id:"m1c4",l:2,q:i("y varie directement avec x. Si x = 12, alors y = 3 (donc y = {1/4}x).","y varies directly with x. If x = 12, then y = 3 (so y = {1/4}x)."),fields:[T("x = \u25A1",[64],i("a. Valeur de x quand y = 16 :","a. Value of x when y = 16:")),T("y = \u25A1",[9],i("b. Valeur de y quand x = 36 :","b. Value of y when x = 36:"))],hint:i("Diviser par {1/4}, c\u2019est multiplier par 4.","Dividing by {1/4} is the same as multiplying by 4."),steps:[i("a. 16 = {1/4}x \u2192 x = 16 \xD7 4 = 64","a. 16 = {1/4}x \u2192 x = 16 \xD7 4 = 64"),i("b. y = {1/4} \xD7 36 = 9","b. y = {1/4} \xD7 36 = 9")]},{id:"m1c5",l:2,q:i("y varie directement avec x. y = 4 quand x = 20. Trouve y quand x = 74.","y varies directly with x. y = 4 when x = 20. Find y when x = 74."),fields:[T("k = \u25A1",[.2],i("k =","k =")),T("y = \u25A1",[14.8],i("y quand x = 74 :","y when x = 74:"))],steps:[i("k = {4/20} = {1/5} = 0.2","k = {4/20} = {1/5} = 0.2"),i("y = 0.2 \xD7 74 = 14.8","y = 0.2 \xD7 74 = 14.8")]},{id:"m1c6",l:3,q:i("La relation entre x et y est proportionnelle. y = 25 quand x = 2. Trouve x quand y = 125.","The relationship between x and y is proportional. y = 25 when x = 2. Find x when y = 125."),fields:[T("k = \u25A1",[12.5],i("k =","k =")),T("x = \u25A1",[10],i("x quand y = 125 :","x when y = 125:"))],steps:[i("k = {25/2} = 12.5","k = {25/2} = 12.5"),i("125 = 12.5x \u2192 x = {125/12.5} = 10","125 = 12.5x \u2192 x = {125/12.5} = 10"),i("Autre raisonnement : 125 = 5 \xD7 25, donc x = 5 \xD7 2 = 10.","Another way: 125 = 5 \xD7 25, so x = 5 \xD7 2 = 10.")]},{id:"m1c7",l:3,q:i("Chez Fruit Mixers, le prix d\u2019un smoothie est proportionnel au nombre d\u2019onces. Un smoothie de 16 oz co\xFBte 3.36 $. Quel est le prix d\u2019un smoothie de 20 oz ?","At Fruit Mixers, the cost of a smoothie is proportional to the number of ounces. A 16-oz smoothie costs $3.36. Find the cost of a 20-oz smoothie."),fields:[T("k = \u25A1 $",[.21],i("Prix d\u2019une once (k) :","Price per ounce (k):")),T("y = \u25A1 $",[4.2],i("Prix du smoothie de 20 oz :","Cost of the 20-oz smoothie:"))],steps:[i("k = {3.36/16} = 0.21 $ par once","k = {3.36/16} = $0.21 per ounce"),i("y = 0.21x","y = 0.21x"),i("y = 0.21 \xD7 20 = 4.20 $","y = 0.21 \xD7 20 = $4.20")]},{id:"m1c8",l:3,q:i("2.5 lb de bananes co\xFBtent 1.50 $. Combien co\xFBtent 9 lb ? (utilise y = kx)","2.5 lbs of bananas cost $1.50. Find the cost of 9 lbs using y = kx."),fields:[T("k = \u25A1",[.6],i("k (prix d\u2019une livre) :","k (price per pound):")),T("y = \u25A1 $",[5.4],i("Prix de 9 lb :","Cost of 9 lbs:"))],steps:[i("k = {1.50/2.5} = 0.6 $ par livre","k = {1.50/2.5} = $0.60 per pound"),i("y = 0.6 \xD7 9 = 5.40 $","y = 0.6 \xD7 9 = $5.40")]},{id:"m1c9",l:3,q:i("3 ramettes de papier p\xE8sent 12 lb. Combien de ramettes y a-t-il dans un envoi de 96 lb ?","A shipment of 3 reams of paper weighs 12 lbs. How many reams are in a 96-lb shipment?"),fields:[T("k = \u25A1",[4],i("Poids d\u2019une ramette (k) :","Weight of one ream (k):")),T("x = \u25A1",[24],i("Nombre de ramettes :","Number of reams:"))],hint:i("x = nombre de ramettes, y = poids. On conna\xEEt le poids : on divise par k.","x = number of reams, y = weight. We know the weight: divide by k."),steps:[i("k = {12/3} = 4 lb par ramette, donc y = 4x","k = {12/3} = 4 lbs per ream, so y = 4x"),i("96 = 4x \u2192 x = {96/4} = 24 ramettes","96 = 4x \u2192 x = {96/4} = 24 reams")]}]},{title:i("Analyser une erreur","Spot the mistake"),goal:i("Rep\xE9rer une erreur de raisonnement et la corriger.","Find a reasoning error and fix it."),worked:{q:i("Un g\xE9ocoucou (*roadrunner*) parcourt 34 m en 4 s. Un \xE9l\xE8ve affirme : \xAB Le mod\xE8le est y = 0.12x \xBB. A-t-il raison ?","A roadrunner travels 34 m in 4 s. A student claims: \u201CThe model is y = 0.12x.\u201D Is the student right?"),steps:[{t:i("Je calcule le vrai k : k = {y/x} = {34/4} = 8.5 m/s","Find the true k: k = {y/x} = {34/4} = 8.5 m/s")},{t:i("D\u2019o\xF9 vient 0.12 ? {4/34} \u2248 0.12 : l\u2019\xE9l\xE8ve a calcul\xE9 {x/y} au lieu de {y/x} (fraction **invers\xE9e**).","Where does 0.12 come from? {4/34} \u2248 0.12: the student computed {x/y} instead of {y/x} (fraction **upside down**).")},{t:i("Bon mod\xE8le : **y = 8.5x**","Correct model: **y = 8.5x**")},{t:i("Contr\xF4le de bon sens : en 6 s, y = 8.5 \xD7 6 = 51 m. Avec 0.12x, il ne ferait que 0.72 m : absurde.","Sanity check: in 6 s, y = 8.5 \xD7 6 = 51 m. With 0.12x it would only travel 0.72 m: absurd.")}],reflect:[i("Comment ne pas inverser la fraction ?","How can you avoid flipping the fraction?"),i("Toujours : k = {y/x} = {ce qu\u2019on obtient/ce qu\u2019on donne}. Ici : m\xE8tres \xF7 secondes.","Always: k = {y/x} = {output/input}. Here: meters \xF7 seconds.")]},ex:[{id:"m1d1",l:3,q:i("La distance y d\u2019un g\xE9ocoucou est proportionnelle au temps x (en s). Il parcourt 34 m en 4 s. Vrai ou faux ?","A roadrunner\u2019s distance y is proportional to time x (s). It travels 34 m in 4 s. True or false?"),fields:[M(Yn,1,i("a. La relation est y = 0.12x.","a. The relationship is y = 0.12x.")),M(Yn,0,i("b. En 6 secondes, il parcourt 51 m.","b. After 6 seconds, it travels 51 m.")),M(Yn,1,i("c. S\u2019il parcourt 170 m, il s\u2019est \xE9coul\xE9 30 s.","c. If it traveled 170 m, 30 seconds passed.")),T("\u25A1 s",[20],i("Corrige c. : temps r\xE9el pour 170 m :","Fix c.: real time for 170 m:"))],steps:[i("k = {34/4} = 8.5, donc y = 8.5x \u2192 a. est **faux**.","k = {34/4} = 8.5, so y = 8.5x \u2192 a. is **false**."),i("b. 8.5 \xD7 6 = 51 \u2192 **vrai**.","b. 8.5 \xD7 6 = 51 \u2192 **true**."),i("c. 170 = 8.5x \u2192 x = {170/8.5} = 20 s \u2192 **faux** (20 s et non 30 s).","c. 170 = 8.5x \u2192 x = {170/8.5} = 20 s \u2192 **false** (20 s, not 30 s).")]},{id:"m1d2",l:3,q:i("Dans y = kx, si on double x, que devient y ?","In y = kx, if you double x, what happens to y?"),fields:[M([i("y double aussi","y doubles too"),i("y augmente de 2","y increases by 2"),i("y ne change pas","y does not change"),i("\xE7a d\xE9pend de k","it depends on k")],0)],steps:[i("Avec x : y\u2081 = kx.","With x: y\u2081 = kx."),i("Avec 2x : y\u2082 = k(2x) = 2(kx) = 2y\u2081.","With 2x: y\u2082 = k(2x) = 2(kx) = 2y\u2081."),i("Donc y double toujours, quel que soit k : c\u2019est la proportionnalit\xE9.","So y always doubles, whatever k is: that is proportionality.")]},{id:"m1d3",l:3,q:i("Latisha tape 175 mots en 5 minutes. Un \xE9l\xE8ve dit : \xAB En 12 minutes, elle tapera 175 + 7 = 182 mots. \xBB Combien de mots tapera-t-elle vraiment ?","Latisha texts 175 words in 5 min. A student says: \u201CIn 12 min she\u2019ll type 175 + 7 = 182 words.\u201D How many words will she really type?"),fields:[T("k = \u25A1",[35],i("Mots par minute (k) :","Words per minute (k):")),T("y = \u25A1",[420],i("Mots en 12 minutes :","Words in 12 minutes:"),[{j:0,v:182,m:i("C\u2019est l\u2019erreur de l\u2019\xE9l\xE8ve : en proportionnalit\xE9 on multiplie, on n\u2019ajoute pas.","That is the student\u2019s mistake: in proportionality we multiply, we don\u2019t add.")}])],steps:[i("L\u2019\xE9l\xE8ve a ajout\xE9 la diff\xE9rence de temps (12 \u2212 5 = 7) : c\u2019est faux, on doit multiplier.","The student added the time difference (12 \u2212 5 = 7): wrong, we must multiply."),i("k = {175/5} = 35 mots par minute \u2192 y = 35x","k = {175/5} = 35 words per minute \u2192 y = 35x"),i("y = 35 \xD7 12 = 420 mots","y = 35 \xD7 12 = 420 words")]}]}],quiz:[{q:i("Quelle \xE9quation est une variation directe ?","Which equation is a direct variation?"),opts:["y = x + 4","y = \u22127x","y = 2x \u2212 1","y = 5"],ans:1,ex:i("y = \u22127x est de la forme y = kx (k = \u22127, b = 0).","y = \u22127x has the form y = kx (k = \u22127, b = 0).")},{q:i("Si y varie directement avec x et y = 20 quand x = 5, alors k = \u2026","If y varies directly with x and y = 20 when x = 5, then k = \u2026"),opts:["100","15","4","{1/4}"],ans:2,ex:i("k = {y/x} = {20/5} = 4.","k = {y/x} = {20/5} = 4.")},{q:i("Par quel point passe TOUJOURS le graphique d\u2019une variation directe ?","Which point does EVERY direct variation graph pass through?"),opts:["(1, 1)","(0, k)","(0, 0)","(k, 0)"],ans:2,ex:i("Si x = 0, y = k \xD7 0 = 0 : l\u2019origine.","If x = 0, y = k \xD7 0 = 0: the origin.")},{q:i("Dans y = kx, k correspond \xE0\u2026","In y = kx, k is\u2026"),opts:[i("l\u2019ordonn\xE9e \xE0 l\u2019origine","the y-intercept"),i("la pente","the slope"),i("l\u2019abscisse \xE0 l\u2019origine","the x-intercept"),i("la valeur de y quand x = 0","the value of y when x = 0")],ans:1,ex:i("y = kx est y = mx + b avec m = k et b = 0.","y = kx is y = mx + b with m = k and b = 0.")},{q:i("y = 3x. Quelle est la valeur de x quand y = 27 ?","y = 3x. What is x when y = 27?"),opts:["81","9","24","30"],ans:1,ex:i("27 = 3x \u2192 x = 27 \xF7 3 = 9.","27 = 3x \u2192 x = 27 \xF7 3 = 9.")},{q:i("Un tableau donne (2, 7), (4, 14), (6, 22). Est-ce une variation directe ?","A table gives (2, 7), (4, 14), (6, 22). Is it direct variation?"),opts:[i("Oui, k = 3.5","Yes, k = 3.5"),i("Non, car {22/6} \u2260 3.5","No, because {22/6} \u2260 3.5"),i("Oui, k = 7","Yes, k = 7"),i("On ne peut pas savoir","We can\u2019t tell")],ans:1,ex:i("{7/2} = {14/4} = 3.5 mais {22/6} \u2248 3.67 : le quotient n\u2019est pas constant.","{7/2} = {14/4} = 3.5 but {22/6} \u2248 3.67: the ratio is not constant.")}]};var Ic={id:"m2",num:2,short:i("Parall\xE8les & perpendiculaires","Parallel & perpendicular"),title:i("Droites parall\xE8les et perpendiculaires","Parallel & Perpendicular Lines"),q:i("Comment la position de deux droites (parall\xE8les ou perpendiculaires) se traduit-elle dans leurs pentes ?","How do the geometric relationships of parallel and perpendicular lines dictate their algebraic slope rules?"),goals:[i("Reconna\xEEtre des pentes parall\xE8les (m\u2081 = m\u2082) et perpendiculaires (m\u2081 \xD7 m\u2082 = \u22121, inverses oppos\xE9s).","Identify parallel slopes (m\u2081 = m\u2082) and perpendicular slopes (m\u2081 \xD7 m\u2082 = \u22121, negative reciprocals)."),i("\xC9crire l\u2019\xE9quation d\u2019une droite parall\xE8le ou perpendiculaire passant par un point donn\xE9.","Write equations of lines parallel or perpendicular to a given line through a point."),i("Traiter les droites horizontales/verticales, analyser des erreurs et justifier.","Handle horizontal/vertical lines, critique errors, and justify.")],lesson:[{title:i("Rappel : la forme y = mx + b","Reminder: slope-intercept form"),body:i(`Dans **y = [m:m]x + [b:b]** (*slope-intercept form*) :
\u2022 [m:m] est la **pente** (*slope*) : de combien y monte quand x avance de 1 ;
\u2022 [b:b] est l\u2019**ordonn\xE9e \xE0 l\u2019origine** (*y-intercept*) : o\xF9 la droite coupe l\u2019axe des y.

Si l\u2019\xE9quation n\u2019est pas sous cette forme, on **isole y**. Exemple :
3y = 2x \u2212 12 \u2192 on divise tout par 3 \u2192 y = [m:{2/3}]x [b:\u2212 4].`,`In **y = [m:m]x + [b:b]** (slope-intercept form):
\u2022 [m:m] is the **slope**: how much y goes up when x moves 1;
\u2022 [b:b] is the **y-intercept**: where the line crosses the y-axis.

If the equation is not in this form, **isolate y**. Example:
3y = 2x \u2212 12 \u2192 divide everything by 3 \u2192 y = [m:{2/3}]x [b:\u2212 4].`),keep:i("Toujours isoler y avant de lire la pente.","Always isolate y before reading the slope."),graph:{x:[-2,8],y:[-6,2],s:1,lx:2,ly:2,lines:[{m:2/3,b:-4,c:"m",lab:"y = (2/3)x \u2212 4",lx:1.5,dx:-12,dy:22,anchor:"end"}],tri:[{x:3,y:-2,run:3,rise:2,lrun:"\u2192 3",lrise:"\u2191 2"}],pts:[{x:0,y:-4,c:"b",lab:"(0, \u22124)",dx:12,dy:18}],desc:i("Droite y = (2/3)x \u2212 4 : elle coupe l\u2019axe des y en (0, \u22124) ; quand on avance de 3, elle monte de 2.","Line y = (2/3)x \u2212 4: it crosses the y-axis at (0, \u22124); moving 3 right, it goes up 2.")}},{title:i("Droites parall\xE8les : m\xEAme pente","Parallel lines: same slope"),body:i(`Deux droites **parall\xE8les** (*parallel*) ne se coupent jamais : elles restent \xE0 la m\xEAme distance.

Pour cela, elles ont la **m\xEAme pente** : **m\u2081 = m\u2082**, et des ordonn\xE9es \xE0 l\u2019origine **diff\xE9rentes**.

Cas particuliers :
\u2022 droites **horizontales** y = c : pente **0** ;
\u2022 droites **verticales** x = c : pente **non d\xE9finie** (*undefined*).`,`Two **parallel** lines never meet: they stay the same distance apart.

So they have the **same slope**: **m\u2081 = m\u2082**, and **different** y-intercepts.

Special cases:
\u2022 **horizontal** lines y = c: slope **0**;
\u2022 **vertical** lines x = c: **undefined** slope.`),keep:i("Parall\xE8les \u21D4 **m\u2081 = m\u2082** (et b\u2081 \u2260 b\u2082).","Parallel \u21D4 **m\u2081 = m\u2082** (and b\u2081 \u2260 b\u2082)."),graph:{x:[-5,5],y:[-5,7],s:1,lx:2,ly:2,lines:[{m:2,b:4,c:"m",lab:"y = 2x + 4",lx:-3.5,dx:14,dy:6},{m:2,b:0,c:"p",lab:"y = 2x",lx:1.5,dx:14,dy:8}],tri:[{x:-2,y:0,run:1,rise:2,lrun:"1",lrise:"2"},{x:1,y:2,run:1,rise:2,lrun:"1",lrise:"2"}],desc:i("y = 2x + 4 et y = 2x : m\xEAme pente 2 (m\xEAmes triangles), droites parall\xE8les.","y = 2x + 4 and y = 2x: same slope 2 (same triangles), parallel lines.")}},{title:i("Droites perpendiculaires : inverses oppos\xE9s","Perpendicular lines: negative reciprocals"),body:i(`Deux droites **perpendiculaires** (*perpendicular*) se coupent en formant un **angle droit** (90\xB0).

Leurs pentes sont des **inverses oppos\xE9s** (*negative reciprocals*) : **m\u2081 \xD7 m\u2082 = \u22121**.

Recette : **\u2460 retourner la fraction, \u2461 changer le signe.**
\u2022 m = 2 = {2/1} \u2192 {1/2} \u2192 **\u2212{1/2}**
\u2022 m = \u2212{3/4} \u2192 \u2212{4/3} \u2192 **{4/3}**`,`Two **perpendicular** lines meet at a **right angle** (90\xB0).

Their slopes are **negative reciprocals**: **m\u2081 \xD7 m\u2082 = \u22121**.

Recipe: **\u2460 flip the fraction, \u2461 change the sign.**
\u2022 m = 2 = {2/1} \u2192 {1/2} \u2192 **\u2212{1/2}**
\u2022 m = \u2212{3/4} \u2192 \u2212{4/3} \u2192 **{4/3}**`),keep:i("Perpendiculaires \u21D4 **m\u2081 \xD7 m\u2082 = \u22121** : on retourne ET on change le signe.","Perpendicular \u21D4 **m\u2081 \xD7 m\u2082 = \u22121**: flip AND change the sign."),graph:{x:[-5,5],y:[-5,5],s:1,lx:2,ly:2,lines:[{m:2,b:0,c:"m",lab:"y = 2x",lx:1.8,dx:12,dy:12},{m:-.5,b:0,c:"p",lab:"y = \u22120.5x",lx:-4.5,dx:4,dy:-12}],ra:[{x:0,y:0,m1:2,m2:-.5,f2:!0}],desc:i("y = 2x et y = \u22120.5x se coupent \xE0 angle droit en (0, 0). 2 \xD7 (\u22120.5) = \u22121.","y = 2x and y = \u22120.5x meet at a right angle at (0, 0). 2 \xD7 (\u22120.5) = \u22121.")},note:i("Pourquoi \u22121 ? Si on fait tourner un triangle de pente d\u2019un quart de tour (90\xB0), \xAB avancer \xBB et \xAB monter \xBB \xE9changent leur place et l\u2019un des deux change de sens.","Why \u22121? Rotating a slope triangle by a quarter turn (90\xB0) swaps \u201Crun\u201D and \u201Crise\u201D, and one of them changes direction.")},{title:i("Droites horizontales et verticales","Horizontal and vertical lines"),body:i(`\u2022 Une droite **horizontale** a pour \xE9quation **y = c** et une pente **0**. Elle est parall\xE8le \xE0 l\u2019axe des x et perpendiculaire \xE0 l\u2019axe des y.
\u2022 Une droite **verticale** a pour \xE9quation **x = c** et une pente **non d\xE9finie**. Elle est parall\xE8le \xE0 l\u2019axe des y et perpendiculaire \xE0 l\u2019axe des x.

Une horizontale et une verticale sont toujours **perpendiculaires**.`,`\u2022 A **horizontal** line has equation **y = c** and slope **0**. It is parallel to the x-axis and perpendicular to the y-axis.
\u2022 A **vertical** line has equation **x = c** and an **undefined** slope. It is parallel to the y-axis and perpendicular to the x-axis.

A horizontal line and a vertical line are always **perpendicular**.`),keep:i("Horizontale : **y = \u2026**, pente 0. Verticale : **x = \u2026**, pente non d\xE9finie.","Horizontal: **y = \u2026**, slope 0. Vertical: **x = \u2026**, undefined slope."),graph:{x:[-5,5],y:[-5,5],s:1,lx:2,ly:2,vl:[{x:3,c:"p",lab:"x = 3"}],hl:[{y:-2,c:"m",lab:"y = \u22122"}],ra:[{x:3,y:-2,m1:"v",m2:0,f2:!0}],desc:i("La droite verticale x = 3 et la droite horizontale y = \u22122 se coupent \xE0 angle droit en (3, \u22122).","The vertical line x = 3 and the horizontal line y = \u22122 meet at a right angle at (3, \u22122).")}},{title:i("M\xE9thode : \xE9crire l\u2019\xE9quation d\u2019une droite qui passe par un point","Method: write a line through a point"),body:i(`**\u2460 La pente :** m\xEAme pente (parall\xE8le) ou inverse oppos\xE9 (perpendiculaire).

**\u2461 Trouver b :** on remplace x et y par les coordonn\xE9es du point dans y = mx + b, puis on r\xE9sout.

**\u2462 \xC9crire** y = mx + b.

Exemple : parall\xE8le \xE0 y = 1.5x \u2212 6 passant par (4, 2).
\u2460 m = 1.5   \u2461 2 = 1.5 \xD7 4 + b \u2192 2 = 6 + b \u2192 b = \u22124   \u2462 **y = 1.5x \u2212 4**`,`**\u2460 The slope:** same slope (parallel) or negative reciprocal (perpendicular).

**\u2461 Find b:** substitute the point\u2019s x and y into y = mx + b, then solve.

**\u2462 Write** y = mx + b.

Example: parallel to y = 1.5x \u2212 6 through (4, 2).
\u2460 m = 1.5   \u2461 2 = 1.5 \xD7 4 + b \u2192 2 = 6 + b \u2192 b = \u22124   \u2462 **y = 1.5x \u2212 4**`),note:i("Dans ton cours, tu verras aussi la forme **point-pente** (*point-slope*) : y \u2212 y\u2081 = m(x \u2212 x\u2081). Elle donne exactement le m\xEAme r\xE9sultat ; utilise la m\xE9thode que tu pr\xE9f\xE8res.","Your course also uses **point-slope form**: y \u2212 y\u2081 = m(x \u2212 x\u2081). It gives exactly the same result; use whichever you prefer."),think:i(`Deux droites parall\xE8les distinctes peuvent-elles avoir la m\xEAme ordonn\xE9e \xE0 l\u2019origine ?
\u2192 Non : m\xEAme pente et m\xEAme b, ce serait la m\xEAme droite.`,`Can two distinct parallel lines share the same y-intercept?

 slope. (You can\u2019t \u201Cflip\u201D 0: the rule m\u2081 \xD7 m\u2082 = \u22121 doesn\u2019t apply to vertical lines.)")]}]}],quiz:[{q:i("Deux droites parall\xE8les ont\u2026","Two parallel lines have\u2026"),opts:[i("la m\xEAme ordonn\xE9e \xE0 l\u2019origine","the same y-intercept"),i("la m\xEAme pente","the same slope"),i("des pentes oppos\xE9es","opposite slopes"),i("des pentes dont le produit est \u22121","slopes with product \u22121")],ans:1,ex:i("Parall\xE8les \u21D4 m\u2081 = m\u2082.","Parallel \u21D4 m\u2081 = m\u2082.")},{q:i("Pente perpendiculaire \xE0 m = \u2212{3/4} ?","Slope perpendicular to m = \u2212{3/4}?"),opts:["{3/4}","\u2212{4/3}","{4/3}","\u2212{3/4}"],ans:2,ex:i("On retourne (\u2212{4/3}) puis on change le signe ({4/3}).","Flip (\u2212{4/3}) then change the sign ({4/3}).")},{q:i("Quelle droite est parall\xE8le \xE0 y = 5x \u2212 2 ?","Which line is parallel to y = 5x \u2212 2?"),opts:["y = \u22125x \u2212 2","y = {1/5}x + 3","y = 5x + 7","y = \u2212{1/5}x"],ans:2,ex:i("M\xEAme pente 5.","Same slope 5.")},{q:i("y = 3x \u2212 1 et y = \u2212{1/3}x + 4 sont\u2026","y = 3x \u2212 1 and y = \u2212{1/3}x + 4 are\u2026"),opts:pn,ans:1,ex:i("3 \xD7 (\u2212{1/3}) = \u22121.","3 \xD7 (\u2212{1/3}) = \u22121.")},{q:i("Pente d\u2019une droite verticale ?","Slope of a vertical line?"),opts:["0","1",i("non d\xE9finie","undefined"),"\u22121"],ans:2,ex:i("Une verticale x = c a une pente non d\xE9finie.","A vertical line x = c has an undefined slope.")},{q:i("Droite parall\xE8le \xE0 y = 2x + 1 passant par (1, 5) ?","Line parallel to y = 2x + 1 through (1, 5)?"),opts:["y = 2x + 5","y = 2x + 3","y = \u2212{1/2}x + 5","y = 5x + 2"],ans:1,ex:i("m = 2 ; 5 = 2 \xD7 1 + b \u2192 b = 3.","m = 2; 5 = 2 \xD7 1 + b \u2192 b = 3.")}]};var Nn=(e={})=>({m:1,b:0,c:"n",dash:!0,lab:"f(x) = x",lx:3,dx:8,dy:22,...e}),js=(e,n,t)=>T("g(x) = \u25A1 \xB7 f(x) + \u25A1",[e,n],t||i("R\xE8gle (si un nombre est n\xE9gatif, \xE9cris le signe \u2212) :","Rule (if a number is negative, type the \u2212 sign):")),Oc={id:"m3",num:3,short:i("Transformations","Transformations"),title:i("Transformations des fonctions affines","Transformations of Linear Functions"),q:i("Comment une modification de la fonction de r\xE9f\xE9rence f(x) = x la d\xE9cale, l\u2019\xE9tire, la comprime ou la retourne ?","How do algebraic modifications to the parent function f(x) = x shift, stretch, compress, and reflect its graph?"),goals:[i("Reconna\xEEtre une translation verticale f(x) + d, horizontale f(x \u2212 c), et un changement d\u2019inclinaison.","Identify vertical shifts f(x) + d, horizontal shifts f(x \u2212 c), and steepness changes."),i("\xC9crire la r\xE8gle d\u2019une fonction transform\xE9e et relier a\xB7f(x) \xE0 la pente.","Write transformed function rules and relate a\xB7f(x) to slope."),i("Analyser des transformations combin\xE9es (dilatation, r\xE9flexion, translations).","Analyze combined transformations (dilation, reflection, translations).")],lesson:[{title:i("La fonction de r\xE9f\xE9rence f(x) = x","The parent function f(x) = x"),body:i(`Toutes les fonctions affines sont des \xAB transform\xE9es \xBB de la **fonction de r\xE9f\xE9rence** (*parent function*) **f(x) = x**.

Ses propri\xE9t\xE9s :
\u2022 pente **1** ;
\u2022 elle passe par l\u2019origine : ordonn\xE9e \xE0 l\u2019origine (0, 0) et abscisse \xE0 l\u2019origine (0, 0).

Dans ce module, on la dessine toujours en **gris pointill\xE9** pour comparer.`,`Every linear function is a \u201Ctransformed\u201D version of the **parent function f(x) = x**.

Its properties:
\u2022 slope **1**;
\u2022 passes through the origin: y-intercept (0, 0) and x-intercept (0, 0).

In this module it is always drawn as a **grey dashed** line for comparison.`),keep:i("f(x) = x : pente 1, passe par (0, 0).","f(x) = x: slope 1, passes through (0, 0)."),graph:{x:[-5,5],y:[-5,5],s:1,lx:2,ly:2,lines:[Nn({dash:!1,c:"k"})],tri:[{x:1,y:1,run:1,rise:1,lrun:"1",lrise:"1"}],desc:i("La droite f(x) = x passe par l\u2019origine avec une pente de 1.","The line f(x) = x passes through the origin with slope 1.")}},{title:i("Translation verticale : f(x) + d","Vertical shift: f(x) + d"),body:i(`On ajoute d **\xE0 l\u2019ext\xE9rieur** de f :
\u2022 d > 0 \u2192 la droite **monte** de d ;
\u2022 d < 0 \u2192 la droite **descend**.

La **pente ne change pas** ; seule l\u2019ordonn\xE9e \xE0 l\u2019origine change : elle devient (0, d).

Exemple : g(x) = f(x) + 6 = x + 6 \u2192 mont\xE9e de 6, ordonn\xE9e \xE0 l\u2019origine (0, 6).`,`Add d **outside** of f:
\u2022 d > 0 \u2192 the line moves **up** d;
\u2022 d < 0 \u2192 the line moves **down**.

The **slope does not change**; only the y-intercept changes: it becomes (0, d).

Example: g(x) = f(x) + 6 = x + 6 \u2192 up 6, y-intercept (0, 6).`),keep:i("**Dehors** des parenth\xE8ses = d\xE9placement **vertical**, dans le sens du signe.","**Outside** the parentheses = **vertical** shift, same direction as the sign."),graph:{x:[-6,4],y:[-4,8],s:1,lx:2,ly:2,lines:[Nn({lx:2}),{m:1,b:6,c:"m",lab:"g(x) = f(x) + 6",lx:-4.5,dx:12,dy:4}],arr:[{x1:0,y1:0,x2:0,y2:6,c:"v",lab:"+6",dx:10,dy:0}],desc:i("g est la droite f(x) = x mont\xE9e de 6 unit\xE9s : elle passe par (0, 6).","g is f(x) = x moved up 6 units: it passes through (0, 6).")}},{title:i("Translation horizontale : f(x \u2212 c)","Horizontal shift: f(x \u2212 c)"),body:i(`On modifie x **\xE0 l\u2019int\xE9rieur** des parenth\xE8ses. Attention, c\u2019est **l\u2019inverse** de ce qu\u2019on croit :
\u2022 f(x **\u2212** 3) \u2192 la droite va vers la **droite** de 3 ;
\u2022 f(x **+** 7) \u2192 la droite va vers la **gauche** de 7.

Pourquoi ? Pour h(x) = f(x \u2212 3), il faut prendre x = 3 pour retrouver f(0) = 0 : le point (0, 0) est **arriv\xE9 en (3, 0)**.

L\u2019abscisse \xE0 l\u2019origine change ; la pente reste la m\xEAme.`,`We change x **inside** the parentheses. Careful: it works **the opposite way** from what you\u2019d expect:
\u2022 f(x **\u2212** 3) \u2192 the line moves **right** 3;
\u2022 f(x **+** 7) \u2192 the line moves **left** 7.

Why? For h(x) = f(x \u2212 3), you need x = 3 to get f(0) = 0: the point (0, 0) **has moved to (3, 0)**.

The x-intercept changes; the slope stays the same.`),keep:i("**Dedans** des parenth\xE8ses = d\xE9placement **horizontal**, **\xE0 l\u2019envers** du signe : x \u2212 c \u2192 droite, x + c \u2192 gauche.","**Inside** the parentheses = **horizontal** shift, **opposite** to the sign: x \u2212 c \u2192 right, x + c \u2192 left."),graph:{x:[-3,6],y:[-4,5],s:1,lx:2,ly:2,lines:[Nn({lx:-2,dx:-10,dy:-10,anchor:"end"}),{m:1,b:-3,c:"p",lab:"h(x) = f(x \u2212 3)",lx:4.6,dx:10,dy:22}],arr:[{x1:0,y1:0,x2:3,y2:0,c:"v",lab:i("3 vers la droite","3 to the right"),dx:-40,dy:-12}],desc:i("h est la droite f(x) = x d\xE9plac\xE9e de 3 vers la droite : (0, 0) arrive en (3, 0).","h is f(x) = x moved 3 to the right: (0, 0) moves to (3, 0).")},think:i(`Quelle diff\xE9rence entre f(x) + 3 et f(x + 3) ?
\u2192 f(x) + 3 monte de 3 ; f(x + 3) va de 3 vers la gauche. (Pour f(x) = x, les deux donnent x + 3 : m\xEAme droite, mais deux fa\xE7ons de la voir !)`,`What is the difference between f(x) + 3 and f(x + 3)?
\u2192 f(x) + 3 moves up 3; f(x + 3) moves left 3. (For f(x) = x both give x + 3: same line, two ways of seeing it!)`)},{title:i("Dilatation et r\xE9flexion : a \xB7 f(x)","Dilation and reflection: a \xB7 f(x)"),body:i(`Multiplier par a change l\u2019**inclinaison** (*steepness*) : la pente devient **a**.
\u2022 |a| > 1 \u2192 **plus raide** (\xE9tirement) ;
\u2022 0 < |a| < 1 \u2192 **moins raide** (compression) ;
\u2022 a n\xE9gatif \u2192 **r\xE9flexion** par rapport \xE0 l\u2019axe des x : la droite \xAB descend \xBB.

f(5x) = 5x aussi : pour f(x) = x, multiplier dedans ou dehors donne la m\xEAme pente.`,`Multiplying by a changes the **steepness**: the slope becomes **a**.
\u2022 |a| > 1 \u2192 **steeper** (stretch);
\u2022 0 < |a| < 1 \u2192 **less steep** (compression);
\u2022 negative a \u2192 **reflection** across the x-axis: the line goes down.

.ex-q { margin-top: 10px; }

.opts { display: flex; flex-wrap: wrap; gap: 8px; }

.opt[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft2); font-weight: 600; }
.opt.ok { border-color: var(--pos); background: var(--pos-soft); }
.opt.ko { border-color: var(--neg); background: var(--neg-soft); }
.fb { margin-top: 14px; padding: 10px 14px; border-radius: 5px; border: 1px solid; }

.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }

.stp .slab { min-width: 9em; font-weight: 600; }
.stp button { width: 46px; height: 46px; border: 1px solid var(--line2); background: var(--btn); border-radius: 5px; font-size: 1.3em; font-weight: 700; line-height: 1; }

.readout { font-family: var(--math); font-size: 1.25em; padding: 10px 14px; background: var(--win); border: 1px solid var(--line); border-radius: 5px; }
.check { display: flex; align-items: center; gap: 10px; min-height: 40px; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); }

/* quiz */
.qprog { height: 8px; background: var(--header); border-radius: 4px; overflow: hidden; margin: 8px 0 16px; }
.qprog > div { height: 100%; background: var(--accent); }
.score { font-size: 2em; font-weight: 700; color: var(--accent-ink); }

/* flashcards */
.fc { min-height: 220px; display: grid; place-items: center; text-align: center; font-size: 1.15em; padding: 26px; border: 2px solid var(--line2); border-radius: 10px; background: var(--view); }
.fc.back { border-color: var(--accent); background: var(--accent-soft); }

/* accueil */
.mods { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; margin-top: 14px; }
.mod { text-align: left; border: 1px solid var(--line); background: var(--view); border-radius: 6px; padding: 16px; box-shadow: var(--shadow); }
.mod:hover { border-color: var(--accent); }
.bar { height: 6px; border-radius: 3px; background: var(--header); margin-top: 10px; overflow: hidden; }
.bar > div { height: 100%; background: var(--pos); }
ol.how { padding-left: 1.3em; margin: 8px 0 0; } ol.how li + li { margin-top: 4px; }
.legend { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 8px; }

@media print {
  .toolbar, .side, .noprint { display: none !important; }
  .body { display: block; }
  .card { box-shadow: none; break-inside: avoid; }
  body { background: #fff; }
}
@media (max-width: 600px) { .graph text { font-size: 19px; } }
