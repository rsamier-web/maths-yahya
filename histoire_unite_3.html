<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Fermer l'angle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&family=Noto+Sans:wght@400;500;600;700&display=swap">
<style>
/* Disposition : liseuse — barre d'outils Breeze en haut, feuille de lecture centrée (texte + illustration), barre de pages en bas */
:root {
  --desk: #eff0f1; --paper: #ffffff; --chrome: #e3e5e7; --btn: #fcfcfc;
  --ink: #232629; --ink2: #5f676e; --rule: #d3d6d9; --rule2: #b6bbc0;
  --accent: #3daee9; --accent-ink: #1a6fa3; --accent-soft: rgba(61,174,233,.13); --accent-soft2: rgba(61,174,233,.26);
  --cm: #c05300; --cp: #1f6fb2; --cb: #1d7f45; --alt: #8e44ad;
  --grid: #e7e9eb; --axis: #50575d; --gbg: #ffffff; --pitch: #f2f7f2; --pitch-l: #c9d8c9;
  --red: #da4453; --red-soft: rgba(218,68,83,.10); --ok: #27ae60;
  --shadow: 0 1px 3px rgba(35,38,41,.08);
  --ui: 'Noto Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --read: 'Literata', 'Noto Serif', Georgia, 'Times New Roman', serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --desk: #202326; --paper: #17191b; --chrome: #2a2e32; --btn: #292c30;
  --ink: #eceff1; --ink2: #a1a9b1; --rule: #383c41; --rule2: #4d5258;
  --accent: #3daee9; --accent-ink: #6cc4f0; --accent-soft: rgba(61,174,233,.14); --accent-soft2: rgba(61,174,233,.28);
  --cm: #ff9a3e; --cp: #5ebff0; --cb: #4fd486; --alt: #c38fe0;
  --grid: #25292c; --axis: #a1a9b1; --gbg: #141618; --pitch: #18201a; --pitch-l: #2f4434;
  --red-soft: rgba(218,68,83,.18);
  --shadow: 0 1px 3px rgba(0,0,0,.4);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --desk: #202326; --paper: #17191b; --chrome: #2a2e32; --btn: #292c30;
  --ink: #eceff1; --ink2: #a1a9b1; --rule: #383c41; --rule2: #4d5258;
  --accent: #3daee9; --accent-ink: #6cc4f0; --accent-soft: rgba(61,174,233,.14); --accent-soft2: rgba(61,174,233,.28);
  --cm: #ff9a3e; --cp: #5ebff0; --cb: #4fd486; --alt: #c38fe0;
  --grid: #25292c; --axis: #a1a9b1; --gbg: #141618; --pitch: #18201a; --pitch-l: #2f4434;
  --red-soft: rgba(218,68,83,.18);
  --shadow: 0 1px 3px rgba(0,0,0,.4);
  color-scheme: dark;
}
/* thèmes choisis dans la liseuse */
.reader[data-rt="light"] {
  --desk: #eff0f1; --paper: #ffffff; --chrome: #e3e5e7; --btn: #fcfcfc; --ink: #232629; --ink2: #5f676e; --rule: #d3d6d9; --rule2: #b6bbc0;
  --accent-ink: #1a6fa3; --cm: #c05300; --cp: #1f6fb2; --cb: #1d7f45; --alt: #8e44ad; --grid: #e7e9eb; --axis: #50575d; --gbg: #ffffff; --pitch: #f2f7f2; --pitch-l: #c9d8c9;
  --red-soft: rgba(218,68,83,.10); --shadow: 0 1px 3px rgba(35,38,41,.08); color-scheme: light;
}
.reader[data-rt="sepia"] {
  --desk: #e9e0cc; --paper: #f8f1e1; --chrome: #e1d6bd; --btn: #f6eedb; --ink: #3a2f22; --ink2: #6e5f4b; --rule: #d6c9ab; --rule2: #bfae8a;
  --accent: #2f8fc4; --accent-ink: #1d6690; --accent-soft: rgba(47,143,196,.12); --accent-soft2: rgba(47,143,196,.24);
  --cm: #ad4a00; --cp: #1e6299; --cb: #2c6e33; --alt: #7d3c98; --grid: #ece2c9; --axis: #5e503c; --gbg: #fbf6ea; --pitch: #eef0dc; --pitch-l: #c8cfa8;
  --red-soft: rgba(218,68,83,.10); --shadow: 0 1px 3px rgba(80,60,20,.12); color-scheme: light;
}
.reader[data-rt="dark"] {
  --desk: #202326; --paper: #17191b; --chrome: #2a2e32; --btn: #292c30; --ink: #eceff1; --ink2: #a1a9b1; --rule: #383c41; --rule2: #4d5258;
  --accent-ink: #6cc4f0; --cm: #ff9a3e; --cp: #5ebff0; --cb: #4fd486; --alt: #c38fe0; --grid: #25292c; --axis: #a1a9b1; --gbg: #141618; --pitch: #18201a; --pitch-l: #2f4434;
  --red-soft: rgba(218,68,83,.18); --shadow: 0 1px 3px rgba(0,0,0,.4); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--desk); }
body { color: var(--ink); font: 15px/1.5 var(--ui); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--chrome); }
button { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--ink2); }
.small { font-size: .84rem; }

.reader { min-height: 100vh; background: var(--desk); color: var(--ink); display: flex; flex-direction: column; }
.bar { background: var(--chrome); z-index: 20; }
.bar.top { position: sticky; top: env(safe-area-inset-top, 0px); border-bottom: 1px solid var(--rule); }
.bar.bottom { position: sticky; bottom: 0; border-top: 1px solid var(--rule); padding-bottom: env(safe-area-inset-bottom, 0px); }
.bar-in { max-width: 1120px; margin: 0 auto; display: flex; align-items: center; gap: 10px; min-height: 48px; padding-block: 5px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar-r { display: flex; gap: 4px; margin-left: auto; }
.tbtn { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 4px 10px; border: 1px solid transparent; border-radius: 4px; background: none; cursor: pointer; }
.tbtn:hover:not(:disabled) { background: var(--accent-soft); border-color: var(--accent); }
.tbtn:disabled { opacity: .35; cursor: default; }
.tbtn.aa { font-weight: 600; font-family: var(--read); font-size: 1.05rem; min-width: 40px; justify-content: center; }
.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.book-t { border: 0; background: none; cursor: pointer; min-width: 0; flex: 1; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 4px; }
.book-ch { color: var(--ink2); }
.prog { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: .84rem; color: var(--ink2); font-variant-numeric: tabular-nums; }
.pbar { width: min(320px, 100%); height: 4px; border-radius: 2px; background: var(--rule); overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
@media (max-width: 640px) { .tl { display: none; } .book-ch { display: none; } }

.stage { flex: 1; width: 100%; max-width: 1120px; margin: 0 auto; padding-block: 22px 28px; touch-action: pan-y;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
.sheet { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; box-shadow: var(--shadow); padding: clamp(18px, 4vw, 40px); animation: turn .28s ease-out; }
@keyframes turn { from { opacity: .4; transform: translateX(10px); } to { opacity: 1; transform: none; } }
.sheet-h { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; }
.sheet-h h1 { font-family: var(--read); font-weight: 600; font-size: calc(var(--fs) * 1.55); line-height: 1.2; }
.eyebrow { font-size: .8rem; color: var(--ink2); letter-spacing: .02em; }
.ch-open { font-size: .78rem; text-transform: uppercase; letter-spacing: .1em; color: var(--accent-ink); font-weight: 600; padding-bottom: 6px; border-bottom: 2px solid var(--accent); width: fit-content; }
.sheet-b { display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr); gap: clamp(20px, 4vw, 44px); align-items: start; }
@media (max-width: 820px) { .sheet-b { grid-template-columns: 1fr; } .figcol { order: -1; } }
.text { font-family: var(--read); font-size: var(--fs); line-height: 1.68; display: flex; flex-direction: column; gap: .7em; max-width: 64ch; hyphens: auto; -webkit-hyphens: auto; }
.text .eqline { text-align: center; padding: .45em .6em; background: var(--desk); border-radius: 4px; overflow-x: auto; hyphens: none; }
.fin { text-align: center; font-style: italic; color: var(--ink2); margin-top: .6em; letter-spacing: .1em; }
.figcol { position: sticky; top: 72px; min-width: 0; }
.fig { margin: 0; display: flex; flex-direction: column; gap: 8px; }
.fig figcaption { font-size: .84rem; color: var(--ink2); text-align: center; }
.fig-svg { width: 100%; max-width: 470px; display: block; margin: 0 auto; background: var(--gbg); border: 1px solid var(--rule); border-radius: 4px; }
@media (max-width: 820px) { .fig-svg { max-width: 420px; } }

/* maths */
.eq { font-family: var(--read); white-space: nowrap; }
.v { font-style: italic; }
.frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 .15em; line-height: 1.15; font-size: .9em; }
.frac .fn { border-bottom: 1px solid currentColor; padding: 0 .25em .05em; }
.frac .fd { padding: .05em .25em 0; }
.c-m { color: var(--cm); font-weight: 600; }
.c-p { color: var(--cp); font-weight: 600; }
.c-b { color: var(--cb); font-weight: 600; }

/* termes */
.term-w { white-space: nowrap; }
.term { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: help; text-decoration: underline dotted; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: .22em; border-radius: 2px; white-space: normal; text-align: inherit; }
.term:hover { background: var(--accent-soft); }
.term.demo { cursor: default; }
.gloss { font-family: var(--ui); font-size: .68em; color: var(--accent-ink); margin-left: .3em; font-style: italic; }
.pop { position: fixed; z-index: 50; background: var(--paper); border: 1px solid var(--accent); border-radius: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.18); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; animation: popin .15s ease-out; }
@keyframes popin { from { opacity: 0; } to { opacity: 1; } }
.pop-en { display: flex; align-items: center; gap: 8px; font-size: 1.15rem; font-weight: 600; }
.pop-tag { font-size: .66rem; font-weight: 700; letter-spacing: .06em; border: 1px solid var(--rule2); border-radius: 3px; padding: 0 5px; color: var(--ink2); }
.pop-fr { font-size: .86rem; color: var(--ink2); }
.pop-def { font-size: .86rem; line-height: 1.45; }
.icon-btn { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 4px; border: 1px solid transparent; background: none; cursor: pointer; color: var(--ink2); flex: none; }
.icon-btn:hover { border-color: var(--rule2); color: var(--ink); }
.icon-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }

/* boutons Breeze */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 34px; padding: 5px 14px; border: 1px solid var(--rule2); border-radius: 4px; background: var(--btn); cursor: pointer; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.primary { background: var(--accent-soft); border-color: var(--accent); }
.btn[aria-pressed="true"] { background: var(--accent-soft2); border-color: var(--accent); }
.btn:disabled { opacity: .4; cursor: default; }
.next-inline { align-self: flex-end; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--rule); background: var(--paper); border-radius: 4px; padding: 8px 14px; cursor: pointer; color: var(--ink2); font-size: .9rem; text-align: left; }
.next-inline:hover { border-color: var(--accent); color: var(--ink); }

/* couverture */
.cover { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(20px, 4vw, 48px); align-items: center; }
@media (max-width: 820px) { .cover { grid-template-columns: 1fr; } }
.cover-t { display: flex; flex-direction: column; gap: 12px; }
.cover-t h1 { font-family: var(--read); font-size: clamp(2.2rem, 6vw, 3.4rem); line-height: 1.05; font-weight: 700; letter-spacing: -.01em; }
.cover-sub { font-family: var(--read); font-size: 1.12rem; line-height: 1.5; max-width: 42ch; }
.cover-tip { font-size: .9rem; color: var(--ink2); padding: 8px 12px; border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 4px; }
.cover-b { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.cover-svg { max-width: 520px; }

/* tiroirs */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.28); display: flex; justify-content: flex-end; }
.drawer { width: min(420px, 100%); height: 100%; background: var(--paper); border-left: 1px solid var(--rule); display: flex; flex-direction: column; animation: slide .2s ease-out;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
@keyframes slide { from { transform: translateX(30px); opacity: .5; } to { transform: none; opacity: 1; } }
.drawer-h { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px 10px 18px; border-bottom: 1px solid var(--rule); background: var(--chrome); }
.drawer-h h2 { font-size: 1rem; font-weight: 600; }
.drawer-b { overflow-y: auto; padding: 14px 18px 24px; display: flex; flex-direction: column; gap: 14px; }
.toc-ch { display: flex; flex-direction: column; gap: 2px; }
.toc-ch h3 { font-size: .92rem; font-weight: 600; padding: 4px 0; }
.toc-p { display: flex; justify-content: space-between; gap: 10px; text-align: left; width: 100%; padding: 7px 10px; border: 1px solid transparent; border-radius: 4px; background: none; cursor: pointer; font-family: var(--read); }
.toc-p:hover { background: var(--accent-soft); }
.toc-p.cur { background: var(--accent-soft2); border-color: var(--accent); }
.lex { margin: 0; display: flex; flex-direction: column; }
.lex-i { padding: 9px 0; border-bottom: 1px solid var(--rule); }
.lex-i dt { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 600; }
.lex-en { color: var(--accent-ink); font-style: italic; font-weight: 500; }
.lex-i dd { margin: 2px 0 0; font-size: .86rem; color: var(--ink2); }
.set { display: flex; flex-direction: column; gap: 8px; }
.set-k { font-size: .78rem; text-transform: uppercase; letter-spacing: .07em; color: var(--ink2); font-weight: 600; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.set-v { min-width: 56px; text-align: center; font-variant-numeric: tabular-nums; }
.switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.sw { width: 34px; height: 18px; border-radius: 9px; border: 1px solid var(--rule2); background: var(--btn); position: relative; flex: none; }
.sw i { position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--ink2); transition: transform .15s; }
.switch input:checked + .sw { background: var(--accent); border-color: var(--accent); }
.switch input:checked + .sw i { transform: translateX(16px); background: #fff; }
.switch input:focus-visible + .sw { box-shadow: 0 0 0 2px var(--accent); }

/* svg */
.g-bg { fill: var(--gbg); }
.g-grid { stroke: var(--grid); stroke-width: 1; fill: none; }
.g-axis { stroke: var(--axis); stroke-width: 1.3; }
.g-head { fill: var(--axis); }
.g-tick { font: 10.5px var(--ui); fill: var(--ink2); }
.g-axl { font: 11px var(--ui); fill: var(--ink2); }
.g-lab { font: 600 11.5px var(--ui); fill: var(--ink); paint-order: stroke; stroke: var(--gbg); stroke-width: 3px; stroke-linejoin: round; }
.g-guide { stroke: var(--rule2); stroke-dasharray: 3 3; stroke-width: 1; }
.lab-m { fill: var(--cm); } .lab-p { fill: var(--cp); } .lab-b { fill: var(--cb); } .lab-main { fill: var(--accent-ink); } .lab-alt { fill: var(--alt); } .lab-fg { fill: var(--ink); }
.ln-main { stroke: var(--accent); stroke-width: 2.6; stroke-linecap: round; fill: none; }
.ln-alt { stroke: var(--alt); stroke-width: 2.6; stroke-linecap: round; fill: none; }
.ln-soft { stroke: var(--ink2); stroke-width: 2; stroke-linecap: round; opacity: .7; }
.dash { stroke-dasharray: 6 5; }
.tri { stroke: var(--cm); stroke-width: 1.8; stroke-dasharray: 5 4; fill: none; }
.tri-head { fill: var(--cm); }
.dot-p { fill: var(--cp); } .dot-b { fill: var(--cb); } .dot-m { fill: var(--cm); } .dot-main { fill: var(--accent); } .dot-alt { fill: var(--alt); } .dot-fg { fill: var(--ink); }
.box { fill: var(--paper); stroke: var(--rule2); }
.box.ok { stroke: var(--ok); stroke-width: 1.5; }
.box-t { font: 13px var(--read); fill: var(--ink); }
.box-t.strong, .tbl.strong { font-weight: 700; }
.tbl { font: 11.5px var(--ui); fill: var(--ink); }
.stairs { fill: var(--desk); stroke: var(--axis); stroke-width: 1.5; stroke-linejoin: round; }
.goal { fill: none; stroke: var(--ink); stroke-width: 6; stroke-linecap: square; stroke-linejoin: miter; }
.goal-hi.bar { stroke: var(--cm); stroke-width: 6; }
.goal-hi.post { stroke: var(--cp); stroke-width: 6; }
.net { fill: none; stroke: var(--rule2); stroke-width: 1; }
.ground { stroke: var(--pitch-l); stroke-width: 3; }
.ball { fill: var(--paper); stroke: var(--ink); stroke-width: 1.6; }
.ball-c { fill: var(--ink); }
.shot { stroke-dasharray: 2 6; stroke-width: 3; }
.pitch { fill: var(--pitch); stroke: var(--pitch-l); }
.pitch-l { fill: none; stroke: var(--pitch-l); stroke-width: 1.5; }
.route { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-dasharray: 7 6; }
.route.thin { stroke-width: 1.5; }
.node { fill: var(--paper); stroke: var(--accent); stroke-width: 2; }
.node-n { font: 700 13px var(--ui); fill: var(--accent-ink); }
.node-t { font: 600 11.5px var(--ui); fill: var(--ink); paint-order: stroke; stroke: var(--pitch); stroke-width: 3px; }
.mat { fill: var(--desk); }
.cage { fill: none; stroke: var(--ink2); stroke-width: 3; }
.net-box { fill: var(--rule); }
.angle { fill: var(--accent-soft); stroke: none; }
.rcard { fill: var(--red-soft); stroke: var(--red); stroke-width: 1.5; }
.rc-eq { font: 600 11.5px var(--read); fill: var(--ink); }
.rc-r { font: 600 11px var(--ui); fill: var(--red); }
.rc-fix { font: 600 13px var(--ui); fill: var(--ink2); }

/* figures HTML */
.fig-html { background: var(--gbg); border: 1px solid var(--rule); border-radius: 4px; padding: 16px; max-width: 470px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.standings { border-collapse: collapse; width: 100%; font-size: .9rem; font-variant-numeric: tabular-nums; }
.standings th, .standings td { padding: 6px 8px; border-bottom: 1px solid var(--rule); text-align: center; }
.standings th:first-child, .standings td:first-child { text-align: left; }
.standings th { font-weight: 600; color: var(--ink2); font-size: .8rem; }
.standings tr.me td { background: var(--accent-soft); font-weight: 600; }
.calc-line { text-align: center; font-size: 1.05rem; }
.calc-line.big { font-size: 1.4rem; padding: 6px; background: var(--desk); border-radius: 4px; }
.choose .ch-q { font-weight: 600; text-align: center; padding: 6px; border: 1px dashed var(--accent); border-radius: 4px; }
.ch-row { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1.3fr); gap: 8px; align-items: center; }
.ch-if { font-size: .88rem; padding: 8px; background: var(--desk); border-radius: 4px; }
.ch-arrow { color: var(--accent-ink); font-weight: 700; }
.ch-then { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border: 1px solid var(--rule2); border-radius: 4px; font-size: .9rem; }
.ch-then .muted { font-size: .8rem; }
.notebook { background: var(--paper); background-image: repeating-linear-gradient(transparent 0 27px, var(--grid) 27px 28px); }
.nb-title { font-family: var(--read); font-weight: 700; font-size: 1.1rem; border-bottom: 2px solid var(--red); padding-bottom: 4px; }
.nb-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.nb-k { font-size: .82rem; color: var(--ink2); font-weight: 600; }
.nb-types { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; font-size: .76rem; text-align: center; color: var(--ink2); }
.nb-types span { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.mini { width: 40px; height: 40px; }
.mini .ln-main { stroke-width: 3; }
.nb-foot { font-family: var(--read); font-style: italic; font-size: .92rem; color: var(--accent-ink); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
