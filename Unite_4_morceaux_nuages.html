e domaine et l’image de m(x).","Give the domain and range of m(x)."),vis:$e(B("m(x)",Ia),()=>(0,z.jsx)(W,{x:[-8,8],y:[-6,8],pieces:Fa})),steps:[{t:o("**Domaine** : je lis les conditions. ① commence à **−6 inclus** ; ② continue de −1 à 3 ; ③ continue après 3, sans fin.","**Domain**: read the conditions. ① starts at **−6 included**; ② goes on from −1 to 3; ③ goes on after 3, with no end.")},{t:o("Il n’y a pas de trou : −1 et 3 sont bien couverts. Domaine : **x ≥ −6**, noté aussi **[−6, ∞)**.","There is no gap: −1 and 3 are covered. Domain: **x ≥ −6**, also written **[−6, ∞)**.")},{t:o("**Image** : je lis les valeurs de y. Chaque morceau est constant : 2, −3 et 5.","**Range**: read the y-values. Each piece is constant: 2, −3 and 5.")},{t:o("Image : **{−3 ; 2 ; 5}**, seulement ces trois valeurs.","Range: **{−3, 2, 5}**, only these three values."),why:o("Écrire −3 ≤ y ≤ 5 serait faux : y = 0 n’est jamais atteint.","Writing −3 ≤ y ≤ 5 would be wrong: y = 0 is never reached.")}],keep:o("Domaine → les x (gauche-droite). Image → les y (bas-haut).","Domain → the x-values (left-right). Range → the y-values (bottom-top).")},ex:[{id:"a3-1",lvl:1,type:"mc",vis:B("d(x)",[["x","0 ≤ x ≤ 5"],["5","5 < x ≤ 9"]]),q:o("Quel est le **domaine** de d ?","What is the **domain** of d?"),col:!0,choices:[{id:"a",t:"0 ≤ x ≤ 9"},{id:"b",t:"0 < x < 9"},{id:"c",t:"5 ≤ x ≤ 9"},{id:"d",t:o("tous les nombres réels","all real numbers")}],ans:"a",sol:[{t:o("① couvre de 0 (inclus) à 5 (inclus) ; ② continue de 5 à 9 (inclus).","① covers 0 (included) to 5 (included); ② goes on from 5 to 9 (included).")},{t:o("Aucun trou → domaine : **0 ≤ x ≤ 9**, soit [0, 9].","No gap → domain: **0 ≤ x ≤ 9**, i.e. [0, 9].")}]},{id:"a3-2",lvl:2,src:"2a",type:"mc",vis:B("f(x)",Xo),q:o("Quel est le **domaine** de f ?","What is the **domain** of f?"),col:!0,choices:[{id:"a",t:"x ≥ −7"},{id:"b",t:"−7 ≤ x ≤ 2"},{id:"c",t:"x > −7"},{id:"d",t:o("tous les nombres réels","all real numbers")}],ans:"a",hint:o("Où commence le premier tière x = −2. Règle ① : −{1/2} × (−2) − 4 = 1 − 4 = −3.","Boundary x = −2. Rule ①: −{1/2} × (−2) − 4 = 1 − 4 = −3.")},{t:o("Règle ② : 2 × (−2) + 1 = −3.","Rule ②: 2 × (−2) + 1 = −3.")},{t:o("−3 = −3 → **h est continue**.","−3 = −3 → **h is continuous**.")}]},{id:"a4-4",lvl:2,src:"2",type:"mc",vis:B("f(x)",Xo),q:o("f est-elle continue ?","Is f continuous?"),choices:[{id:"a",t:o("Oui","Yes")},{id:"b",t:o("Non","No")}],ans:"b",sol:[{t:o("En x = −2 : on passe de −6 à −4 → saut.","At x = −2: from −6 to −4 → jump.")},{t:o("En x = 2 : on passe de −4 à −1 → saut.","At x = 2: from −4 to −1 → jump.")},{t:o("**f est discontinue** (c’est une fonction en escalier).","**f is discontinuous** (it is a step function).")}]},{id:"a4-5",lvl:3,src:"5–8",type:"multi",q:o("Complète avec **toujours**, **parfois** ou **jamais**.","Fill in with **always**, **sometimes** or **never**."),options:[{id:"A",t:o("toujours","always")},{id:"S",t:o("parfois","sometimes")},{id:"N",t:o("jamais","never")}],items:[{t:o("5. Une fonction par morceaux est ___ discontinue.","5. A piecewise function will ___ be discontinuous."),ans:"S"},{t:o("6. Une fonction par morceaux a ___ pour domaine tous les réels.","6. A piecewise function will ___ have a domain of all real numbers."),ans:"S"},{t:o("7. Une fonction en escalier est ___ continue.","7. A step function will ___ be continuous."),ans:"N"},{t:o("8. Une fonction par morceaux est ___ définie par deux fonctions ou plus.","8. A piecewise function will ___ be defined by two or more functions."),ans:"A"}],hint:o("Pour « parfois », cherche un exemple ET un contre-exemple parmi g, f et h.","For “sometimes”, find an example AND a counterexample among g, f and h."),sol:[{t:o("5. **parfois** : f est discontinue, mais g et h sont continues.","5. **sometimes**: f is discontinuous, but g and h are continuous.")},{t:o("6. **parfois** : g a pour domaine tous les réels, mais f commence à −7.","6. **sometimes**: g has a domain of all real numbers, but f starts at −7.")},{t:o( age**.")},{t:o("Variable cachée : la taille de l’incendie → pas de causalité entre pompiers et dégâts.","Lurking variable: the size of the fire → no causation between firefighters and damage.")}]},{id:"b3-4",lvl:3,type:"mc",q:o("Chez les enfants de 6 à 12 ans, la pointure et le niveau de lecture sont fortement corrélés (r = 0,8). Quelle est la meilleure explication ?","Among children aged 6 to 12, shoe size and reading level are strongly correlated (r = 0.8). What is the best explanation?"),col:!0,choices:[{id:"a",t:o("L’**âge** fait grandir les pieds et progresser en lecture.","**Age** makes feet grow and reading improve.")},{id:"b",t:o("Avoir de grands pieds aide à lire.","Big feet help you read.")},{id:"c",t:o("Lire fait grandir les pieds.","Reading makes feet grow.")},{id:"d",t:o("r = 0,8 prouve une causalité.","r = 0.8 proves causation.")}],ans:"a",sol:[{t:o("Aucune explication logique directe entre pieds et lecture.","No direct logical link between feet and reading.")},{t:o("En grandissant (âge ↑), les enfants ont de plus grands pieds **et** lisent mieux.","As they grow older (age ↑), children have bigger feet **and** read better.")},{t:o("Variable cachée : **l’âge**. Un r élevé ne prouve jamais à lui seul une causalité.","Lurking variable: **age**. A high r alone never proves causation.")}]}]},{id:"B4",short:o("Calculer et interpréter r","Compute & interpret r"),title:o("Calculer r et l’interpréter","Computing and interpreting r"),goal:o("Obtenir r avec un outil, l’arrondir et le traduire en phrase.","Get r with a tool, round it and put it into words."),worked:{q:o("Un gardien note ses heures d’entraînement par semaine (x) et ses buts encaissés par match (y). Calcule r au centième et interprète-le.","A goalkeeper records his training hours per week (x) and goals conceded per game (y). Find r to the nearest hundredth and interpret it."),vis:()=>(0,x.jsxs)("div",{children:[(0,x.jsx)(gf,{}),(0,x.jsx)(W,{...xf,points:Ya,trend:vf})]}),steps:[{t:o("Je saisis x dans ait acheter des parapluies et rend les routes glissantes.","Rain makes people buy umbrellas and makes roads slippery.")},{q:o("Quelle valeur de r est impossible ?","Which value of r is impossible?"),choices:["−1,2","−1","0,5","0,99"].map((e,t)=>({id:"abcd"[t],t:o(e,e.replace(",","."))})),ans:"a",ex:o("r est toujours entre −1 et 1.","r is always between −1 and 1.")},{q:o("Quel nuage a un r proche de −0,9 ?","Which plot has r close to −0.9?"),keepOrder:!0,choices:[{id:"a",t:"A",g:xe(.9,51)},{id:"b",t:"B",g:xe(-.9,52)},{id:"c",t:"C",g:xe(-.3,53)}],ans:"b",ex:o("B descend avec des points serrés. C descend mais est très dispersé (r ≈ −0,3).","B goes down with tight points. C goes down but is very spread out (r ≈ −0.3).")},{q:o("Arrondis r = −0,846 au centième.","Round r = −0.846 to the nearest hundredth."),choices:["−0,85","−0,84","−0,8","−0,846"].map((e,t)=>({id:"abcd"[t],t:o(e,e.replace(",","."))})),ans:"a",ex:o("Le 3ᵉ chiffre est 6 ≥ 5 → −0,85.","The 3rd digit is 6 ≥ 5 → −0.85.")}];var Nf=`:root {
  --win: #eff0f1; --view: #ffffff; --header: #e3e5e7; --btn: #fcfcfc;

}
:root[data-theme="dark"] {
  --win: #202326; --view: #141618; --header: #2a2e32; --btn: #292c30;
  --fg: #fcfcfc; --fg2: #a9b1b9; --line: #383c41; --line2: #4d5258;
  --accent-ink: #6cc4f0; --accent-soft: rgba(61,174,233,.14); --accent-soft2: rgba(61,174,233,.28);
  --pos-soft: rgba(39,174,96,.16); --pos-ink: #5fd18f; --neg-soft: rgba(218,68,83,.16); --neg-ink: #f0727e; --warn-soft: rgba(246,116,0,.15); --warn-ink: #ffa451;
  --cm: #ff9a3e; --cp: #5ebff0; --cb: #4fd486; --cv: #c597f0;
  --grid: #24282b; --grid2: #3a3f44; --axis: #c7cdd2; --pbg: #17191b;
  --shadow: 0 1px 2px rgba(0,0,0,.4);
  color-scheme: dark;
}
:root[data-size="big"] { --fs: 19px; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--win); }
body { color: var(--fg); font: var(--fs)/1.6 var(--ui); letter-spacing: .005em; }
button { font: inherit; color: inherit; cursor: pointer; }
input { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; text-wrap: balance; line-height: 1.3; }
h1 { font-size: 1.5em; } h2 { font-size: 1.25em; } h3 { font-size: 1.08em; }
p { margin: 0; }
strong { font-weight: 700; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* fraction & couleurs */
.frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .88em; line-height: 1.12; margin: 0 .14em; }
.frac .fn { border-bottom: 1.6px solid currentColor; padding: 0 .18em; }
.frac .fd { padding: 0 .18em; }
.c-m, .c-k, .c-a { color: var(--cm); font-weight: 700; }
.c-b, .c-d { color: var(--cb); font-weight: 700; }
.c-c, .c-p { color: var(--cp); font-weight: 700; }
.c-v { color: var(--cv); font-weight: 700; }
.c-r { color: var(--neg-ink); font-weight: 700; }
.eq { font-family: var(--math); font-size: 1.12em; white-space: nowrap; }

/* fen\\xEAtre */
.toolbar { position: sticky; top: 0; z-index: 5; background: var(--header); border-bottom: 1px solid var(--line); }
.tb-in { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 50px; padding: 6px 16px; flex-wrap: wrap; }
.tb-app { display: flex; align-items: center; gap: 10px; min-width: 0; }
.tb-logo { width: 24px; height: 24px; flex: none; }
.tb-title { font-weight: 600; }
.tb-sub { color: var(--fg2); font-weight: 400; margin-left: 6px; }
.tb-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 4px; overflow: hidden; background: var(--btn); }
.seg button { border: 0; background: transparent; padding: 6px 12px; min-height: 36px; min-width: 40px; }
.seg button + button { border-left: 1px solid var(--line2); }
.seg button[aria-pressed="true"] { background: var(--accent-soft2); color: var(--accent-ink); font-weight: 600; }
.tbtn { border: 1px solid var(--line2); background: var(--btn); border-radius: 4px; padding: 6px 12px; min-height: 36px; }
.tbtn:hover { border-color: var(--accent); }

.body { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: calc(100vh - 51px); }
.side { border-right: 1px solid var(--line); padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 51px; align-self: start; height: calc(100vh - 51px); overflow-y: auto; }
.side-h { font-size: .78em; text-transform: uppercase; letter-spacing: .06em; color: var(--fg2); padding: 12px 10px 4px; }
.nav-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 1px solid transparent; background: transparent; border-radius: 4px; padding: 8px 10px; min-height: 42px; }
.nav-item:hover { background: var(--accent-soft); }
.nav-item[aria-current="page"] { background: var(--accent-soft2); border-color: var(--accent); font-weight: 600; }
.nav-num { width: 26px; height: 26px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: .82em; font-weight: 700; background: var(--header); border: 1px solid var(--line2); }
.nav-prog { margin-left: auto; font-size: .78em; color: var(--fg2); font-variant-numeric: tabular-nums; }
.main { padding: 22px 28px 60px; max-width: 1060px; width: 100%; }
@media (max-width: 820px) {
  .body { grid-template-columns: 1fr; }
  .side { position: static; height: auto; flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px; }
  .side-h { display: none; }
  .nav-item { width: auto; white-space: nowrap; }
  .nav-prog { display: none; }
  .main { padding: 16px 14px 50px; }
}

/* cartes */
.card { background: var(--view); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow); padding: 20px 22px; }
.card + .card, .stack > * + * { margin-top: 16px; }
.page-h { margin-bottom: 18px; }
.page-h .eyebrow { color: var(--accent-ink); font-weight: 600; font-size: .85em; text-transform: uppercase; letter-spacing: .05em; }
.page-h p { color: var(--fg2); margin-top: 6px; max-width: 70ch; }
.muted { color: var(--fg2); }
.small { font-size: .88em; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; align-items: start; }
@media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 18px; flex-wrap: wrap; }
.tab { border: 1px solid transparent; border-bottom: 0; background: transparent; padding: 10px 16px; border-radius: 5px 5px 0 0; display: flex; gap: 8px; align-items: center; min-height: 44px; margin-bottom: -1px; }
.tab[aria-selected="true"] { background: var(--view); border-color: var(--line); font-weight: 600; color: var(--accent-ink); }
.tab .tnum { font-size: .8em; color: var(--fg2); }

.btn { border: 1px solid var(--line2); background: var(--btn); border-radius: 4px; padding: 8px 16px; min-height: 44px; display: inline-flex; align-items: center; gap: 8px; }
.btn:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn.primary:hover:not(:disabled) { background: #2a9bd6; }
.btn.ghost { background: transparent; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.chip { border: 1px solid var(--line2); background: var(--btn); border-radius: 999px; padding: 6px 14px; min-height: 40px; display: inline-flex; align-items: center; gap: 8px; }
.chip[aria-pressed="true"] { background: var(--accent-soft2); border-color: var(--accent); font-weight: 600; }
.chip .cnt { font-size: .8em; color: var(--fg2); font-variant-numeric: tabular-nums; }

.keep { border-left: 4px solid var(--accent); background: var(--accent-soft); padding: 12px 16px; border-radius: 0 5px 5px 0; margin-top: 14px; }
.keep h4 { font-size: .85em; text-transform: uppercase; letter-spacing: .05em; color: var(--accent-ink); margin-bottom: 4px; }
.note { border-left: 4px solid var(--line2); padding: 8px 14px; margin-top: 12px; color: var(--fg2); font-size: .94em; }
.think { border: 1px dashed var(--line2); border-radius: 6px; padding: 12px 16px; margin-top: 14px; }
.think h4 { font-size: .9em; color: var(--cv); margin-bottom: 4px; }
.para + .para { margin-top: 10px; }

/* stepper de cartes */
.stepnav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; }
.dot { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line2); background: var(--btn); font-size: .8em; display: grid; place-items: center; padding: 0; }
.dot[aria-current="step"] { border: 2px solid var(--accent); font-weight: 700; color: var(--accent-ink); }
.dot.done { background: var(--pos-soft); border-color: var(--pos); color: var(--pos-ink); }

/* tableaux */
table.t { border-collapse: collapse; margin-top: 10px; font-variant-numeric: tabular-nums; }
table.t th, table.t td { border: 1px solid var(--line2); padding: 6px 14px; text-align: center; }
table.t th { background: var(--header); font-weight: 600; }
table.t.lex td, table.t.lex th { text-align: left; vertical-align: top; }
.tw { overflow-x: auto; }

/* graphe */
.graph { width: 100%; display: block; margin: 12px 0 4px; }
.graph-wrap { max-width: 470px; overflow: visible; }
.graph text { font-family: var(--ui); }
.graph .lbl { paint-order: stroke; stroke: var(--pbg); stroke-width: 5px; stroke-linejoin: round; }
.gdesc { font-size: .85em; color: var(--fg2); }

/* exercices */
.lvl { display: inline-flex; align-items: center; gap: 6px; font-size: .8em; font-weight: 600; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line2); background: var(--header); }
.lvl.l0 { border-color: var(--cv); color: var(--cv); background: transparent; }
.lvl.l1 { border-color: var(--pos); color: var(--pos-ink); background: var(--pos-soft); }
.lvl.l2 { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft); }
.lvl.l3 { border-color: var(--warn); color: var(--warn-ink); background: var(--warn-soft); }
.ex-q { margin-top: 10px; }
.fields { margin-top: 14px; display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.field .flab { width: 100%; font-weight: 600; font-size: .95em; }
.box { width: 6.2em; min-height: 46px; padding: 6px 10px; border: 2px solid var(--line2); border-radius: 5px; background: var(--view); text-align: center; font-family: var(--math); font-size: 1.1em; }
.box:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft2); }
.box.ok { border-color: var(--pos); background: var(--pos-soft); }
.box.ko { border-color: var(--neg); background: var(--neg-soft); }
.mark { font-weight: 700; font-size: .9em; }
.mark.ok { color: var(--pos-ink); } .mark.ko { color: var(--neg-ink); }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { border: 2px solid var(--line2); background: var(--btn); border-radius: 6px; padding: 8px 16px; min-height: 48px; min-width: 64px; text-align: left; }
.opt[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft2); font-weight: 600; }
.opt.ok { border-color: var(--pos); background: var(--pos-soft); }
.opt.ko { border-color: var(--neg); background: var(--neg-soft); }
.fb { margin-top: 14px; padding: 10px 14px; border-radius: 5px; border: 1px solid; }
.fb.ok { border-color: var(--pos); background: var(--pos-soft); color: var(--pos-ink); }
.fb.ko { border-color: var(--neg); background: var(--neg-soft); color: var(--neg-ink); }
.fb.info { border-color: var(--warn); background: var(--warn-soft); color: var(--warn-ink); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.steps { margin: 14px 0 0; padding: 0; list-style: none; counter-reset: s; }
.steps li { counter-increment: s; position: relative; padding: 10px 12px 10px 48px; border: 1px solid var(--line); border-radius: 5px; background: var(--win); }
.steps li + li { margin-top: 8px; }
.steps li::before { content: counter(s); position: absolute; left: 12px; top: 10px; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 700; font-size: .85em; display: grid; place-items: center; }
.steps .why { color: var(--fg2); font-size: .9em; margin-top: 4px; }
.sol { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 12px; }
.worked { border-left: 4px solid var(--cv); }
.worked-h { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.tag { font-size: .78em; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--cv); }
.pw { display: inline-flex; align-items: center; gap: 8px; font-family: var(--math); font-size: 1.1em; margin: 8px 0; }
.pw-brace { border-left: 2px solid var(--fg); border-radius: 10px 0 0 10px; padding: 2px 0 2px 12px; display: grid; gap: 2px; }
.pw-row { display: flex; gap: 14px; white-space: nowrap; }
.pw-cond { color: var(--fg2); }

/* explorer */
.ctrl { display: grid; gap: 14px; }
.stp { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.stp .slab { min-width: 9em; font-weight: 600; }
.stp button { width: 46px; height: 46px; border: 1px solid var(--line2); background: var(--btn); border-radius: 5px; font-size: 1.3em; font-weight: 700; line-height: 1; }
.stp button:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.stp .sval { min-width: 4.4em; text-align: center; font-family: var(--math); font-size: 1.15em; padding: 6px 8px; border: 1px solid var(--line); border-radius: 5px; background: var(--win); }
.readout { font-family: var(--math); font-size: 1.25em; padding: 10px 14px; background: var(--win); border: 1px solid var(--line); border-radius: 5px; }
.check { display: flex; align-items: center; gap: 10px; min-height: 40px; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); }

/* quiz */
.qprog { height: 8px; background: var(--header); border-radius: 4px; overflow: hidden; margin: 8px 0 16px; }
.qprog > div { height: 100%; background: var(--accent); }
.score { font-size: 2em; font-weight: 700; color: var(--accent-ink); }

/* flashcards */
.fc { min-height: 220px; display: grid; place-items: center; text-align: center; font-size: 1.15em; padding: 26px; border: 2px solid var(--line2); border-radius: 10px; background: var(--view); }
.fc.back { border-color: var(--accent); background: var(--accent-soft); }

/* accueil */
.mods { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; margin-top: 14px; }
.mod { text-align: left; border: 1px solid var(--line); background: var(--view); border-radius: 6px; padding: 16px; box-shadow: var(--shadow); }
.mod:hover { border-color: var(--accent); }
.bar { height: 6px; border-radius: 3px; background: var(--header); margin-top: 10px; overflow: hidden; }
.bar > div { height: 100%; background: var(--pos); }
ol.how { padding-left: 1.3em; margin: 8px 0 0; } ol.how li + li { margin-top: 4px; }
.legend { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 8px; }

@media print {
  .toolbar, .side, .noprint { display: none !important; }
  .body { display: block; }
  .card { box-shadow: none; break-inside: avoid; }
  body { background: #fff; }
}
@media (max-width: 600px) { .graph text { font-size: 19px; } }

/* ===== ajouts : unité 4 morceaux & nuages ===== */
:root { --band: rgba(61,174,233,.07); }
:root[data-theme="dark"] { --band: rgba(61,174,233,.09); }
.bi-en { color: var(--fg2); font-style: italic; margin-top: 6px; border-left: 3px solid var(--line2); padding-left: 10px; }
.bi-en-i { color: var(--fg2); font-style: italic; font-weight: 400; }
.say { border: 1px solid var(--line2); background: var(--btn); border-radius: 50%; width: 40px; height: 40px; display: inline-grid; place-items: center; flex: none; color: var(--accent-ink); padding: 0; }
.say:hover { border-color: var(--accent); background: var(--accent-soft); }
.pw-name { font-style: italic; }
.pw-row { align-items: baseline; padding: 3px 8px; border-radius: 4px; }
.pw-row.on { background: var(--accent-soft2); }
.pw-num { font-family: var(--ui); font-weight: 700; font-size: .85em; }
.pw-e { min-width: 5.5em; }
.vis-stack > * + * { margin-top: 6px; }
.annot-legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: .92em; color: var(--fg2); margin-top: 8px; }
.chipc { font-family: var(--math); padding: 2px 8px; border: 1px solid var(--line2); border-radius: 4px; color: var(--fg); }
.kbd-zone { border-radius: 6px; }
.range { width: 100%; height: 36px; accent-color: var(--accent); }
.testrow { display: flex; gap: 8px; align-items: baseline; padding: 2px 6px; border-radius: 4px; }
.testrow.on { background: var(--pos-soft); }
.ex-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.ex-vis { margin: 12px 0 4px; }
.ex > .opts, .ex > .numf, .ex > .multi { margin-top: 14px; }
.given { border: 1px dashed var(--cv); border-radius: 6px; padding: 10px 14px; margin: 12px 0; }
.given h4 { font-size: .82em; color: var(--cv); text-transform: uppercase; letter-spacing: .05em; }
.numf { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.numrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.numpad { display: grid; grid-template-columns: repeat(3, 60px); gap: 6px; }
.numpad button { height: 54px; font-size: 1.25em; border: 1px solid var(--line2); background: var(--btn); border-radius: 6px; font-family: var(--math); }
.numpad button:hover { border-color: var(--accent); background: var(--accent-soft); }
.small-btn { min-height: 38px; padding: 4px 12px; font-size: .9em; }
.multi { display: flex; flex-direction: column; gap: 10px; }
.mrow { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; background: var(--win); }
.mlab { margin-bottom: 8px; font-weight: 600; }
.opts-col { flex-direction: column; } .opts-col .opt { width: 100%; }
.opts-g { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
.opt-g { display: flex; flex-direction: column; align-items: center; padding: 8px; text-align: center; }
.opt-g .graph-wrap { width: 100%; }
.opt:disabled { cursor: default; opacity: 1; }
.opt-t { display: inline-flex; gap: 8px; align-items: baseline; }
.srctag { font-size: .8em; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--header); border: 1px solid var(--line2); color: var(--fg2); }
.lvl-t { font-weight: 500; margin-left: 2px; }
.fam-h { margin-bottom: 14px; } .fam-h p { margin-top: 4px; }
.cnt { font-size: .8em; color: var(--fg2); font-variant-numeric: tabular-nums; }
.fnum { width: 22px; height: 22px; border-radius: 50%; background: var(--header); border: 1px solid var(--line2); display: grid; place-items: center; font-size: .78em; font-weight: 700; flex: none; }
.review { padding-left: 1.3em; margin-top: 14px; } .review li { margin-top: 8px; }
.review li.ok .mark { color: var(--pos-ink); } .review li.ko .mark { color: var(--neg-ink); }
.steps li.fresh { border-color: var(--accent); background: var(--accent-soft); }
.plots4 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; max-width: 620px; }
.plots3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.plotcell { margin: 0; border: 1px solid var(--line); border-radius: 6px; padding: 6px; background: var(--view); }
.plotcell figcaption { text-align: center; }
.plotcell .graph-wrap { max-width: none; }
.plotcell .gdesc { display: none; }
.fld { display: flex; flex-direction: column; gap: 4px; font-weight: 600; }
textarea { font: inherit; font-family: var(--math); padding: 8px 10px; border: 2px solid var(--line2); border-radius: 5px; background: var(--view); color: var(--fg); resize: vertical; }
textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft2); }
figure.graph-wrap { margin: 0; }
.graph-wrap.big { max-width: 660px; }
.graph-wrap.small { max-width: 210px; margin: 0 auto; }
.graph-wrap.small .graph { margin: 0; }
.aids { border-top: 1px solid var(--line); background: var(--view); }
.aids-in { display: flex; flex-wrap: wrap; gap: 4px 24px; padding: 6px 16px; }
.tbtn[aria-pressed="true"] { background: var(--accent-soft2); border-color: var(--accent); }
.fiche-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; margin-top: 12px; }
.fiche-item { display: flex; align-items: center; gap: 12px; text-align: left; border: 1px solid var(--line); background: var(--btn); border-radius: 6px; padding: 10px 12px; min-height: 52px; }
.fiche-item:hover { border-color: var(--accent); background: var(--accent-soft); }
.fiche-n { min-width: 4.8em; font-weight: 700; color: var(--accent-ink); }
.fiche-item > span:nth-child(2) { flex: 1; }
.lesson-body { font-size: 1.04em; }
.gdesc summary { cursor: pointer; min-height: 32px; }
.chip .fnum { margin-right: 2px; }
button.mod { font: inherit; color: inherit; }
.card > .opts { margin-top: 14px; }
