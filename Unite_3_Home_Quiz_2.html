<title>U3 Home Quiz 2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Mono:wght@400;600&family=Noto+Serif:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Disposition : fenêtre d'application KDE — barre d'outils, panneau latéral, zone de contenu en cartes Kirigami */
:root {
  --win: #eff0f1; --view: #ffffff; --header: #e3e5e7; --btn: #fcfcfc;
  --fg: #232629; --fg2: #5f676e; --line: #d3d6d9; --line2: #b6bbc0;
  --accent: #3daee9; --accent-ink: #1a6fa3; --accent-soft: rgba(61,174,233,.13); --accent-soft2: rgba(61,174,233,.26);
  --pos: #27ae60; --pos-soft: rgba(39,174,96,.11); --pos-ink: #1b7a43;
  --neg: #da4453; --neg-soft: rgba(218,68,83,.09); --neg-ink: #b3303d;
  --warn: #f67400; --warn-soft: rgba(246,116,0,.10); --warn-ink: #9a4a00;
  --cm: #c05300; --cp: #1f6fb2; --cb: #1d7f45;
  --grid: #eceef0; --grid2: #d6d9dc; --axis: #50575d; --pbg: #ffffff;
  --shadow: 0 1px 2px rgba(35,38,41,.07);
  --ui: 'Noto Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --math: 'Noto Serif', 'Cambria', Georgia, 'Times New Roman', serif;
  --mono: 'Noto Sans Mono', ui-monospace, 'DejaVu Sans Mono', monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --win: #202326; --view: #141618; --header: #2a2e32; --btn: #292c30;
  --fg: #fcfcfc; --fg2: #a1a9b1; --line: #383c41; --line2: #4d5258;
  --accent: #3daee9; --accent-ink: #6cc4f0; --accent-soft: rgba(61,174,233,.14); --accent-soft2: rgba(61,174,233,.28);
  --pos-soft: rgba(39,174,96,.16); --pos-ink: #5fd18f; --neg-soft: rgba(218,68,83,.16); --neg-ink: #f0727e; --warn-soft: rgba(246,116,0,.15); --warn-ink: #ffa451;
  --cm: #ff9a3e; --cp: #5ebff0; --cb: #4fd486;
  --grid: #1f2225; --grid2: #2e3236; --axis: #a1a9b1; --pbg: #17191b;
  --shadow: 0 1px 2px rgba(0,0,0,.4);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --win: #202326; --view: #141618; --header: #2a2e32; --btn: #292c30;
  --fg: #fcfcfc; --fg2: #a1a9b1; --line: #383c41; --line2: #4d5258;
  --accent: #3daee9; --accent-ink: #6cc4f0; --accent-soft: rgba(61,174,233,.14); --accent-soft2: rgba(61,174,233,.28);
  --pos-soft: rgba(39,174,96,.16); --pos-ink: #5fd18f; --neg-soft: rgba(218,68,83,.16); --neg-ink: #f0727e; --warn-soft: rgba(246,116,0,.15); --warn-ink: #ffa451;
  --cm: #ff9a3e; --cp: #5ebff0; --cb: #4fd486;
  --grid: #1f2225; --grid2: #2e3236; --axis: #a1a9b1; --pbg: #17191b;
  --shadow: 0 1px 2px rgba(0,0,0,.4);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--win); }
body { color: var(--fg); font: 15px/1.55 var(--ui); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--header); }
button { font: inherit; color: inherit; }
h1, h2, h3 { text-wrap: balance; margin: 0; font-weight: 600; }
p { margin: 0; }
sub, sup { font-size: .68em; line-height: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ---------- fenêtre ---------- */
.toolbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--header); border-bottom: 1px solid var(--line); }
.tb-in { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 46px; padding-block: 6px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); flex-wrap: wrap; }
.tb-app { display: flex; align-items: center; gap: 10px; min-width: 0; }
.tb-logo { width: 22px; height: 22px; fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-linecap: round; }
.tb-logo circle { fill: var(--accent); stroke: none; }
.tb-title { font-weight: 600; white-space: nowrap; }
.tb-sub { font-weight: 400; color: var(--fg2); margin-left: 6px; }
.body { display: grid; grid-template-columns: 216px minmax(0, 1fr); min-height: calc(100vh - 47px); }
.side { border-right: 1px solid var(--line); background: var(--win); padding: 12px 10px; padding-left: max(12px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 2px; position: sticky; top: calc(47px + env(safe-area-inset-top, 0px)); align-self: start; height: calc(100vh - 47px); }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 4px; border: 1px solid transparent; background: none; text-align: left; cursor: pointer; width: 100%; }
.nav-item:hover { background: var(--accent-soft); }
.nav-item[aria-current="page"] { background: var(--accent-soft2); border-color: var(--accent); }
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
.main { min-width: 0; padding-block: 24px 64px; padding-left: 28px; padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page { max-width: 1060px; display: flex; flex-direction: column; gap: 18px; }
@media (max-width: 760px) {
  .body { display: block; }
  .side { position: sticky; top: calc(47px + env(safe-area-inset-top, 0px)); z-index: 4; height: auto; flex-direction: row; overflow-x: auto; gap: 4px; border-right: 0; border-bottom: 1px solid var(--line);
    padding: 6px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px)); }
  .nav-item { width: auto; flex: none; padding: 6px 10px; }
  .main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-top: 18px; }
  .tb-sub { display: none; }
}

/* ---------- typographie ---------- */
.ph { display: flex; flex-direction: column; gap: 6px; }
.ph h1 { font-size: 1.6rem; line-height: 1.25; }
.lead { color: var(--fg2); max-width: 66ch; }
.eyebrow { font-size: .78rem; color: var(--fg2); letter-spacing: .02em; }
.muted { color: var(--fg2); }
.sec-t { font-size: 1.02rem; margin-bottom: 10px; }
.en-term { font-style: italic; color: var(--fg2); font-size: .92em; }
.hint-s { font-size: .82rem; color: var(--fg2); }
.center { text-align: center; }

/* ---------- maths ---------- */
.eq { font-family: var(--math); font-size: 1.08em; white-space: normal; }
.eq-big { font-size: 1.55rem; }
.v { font-family: var(--math); font-style: italic; }
.frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 .15em; line-height: 1.2; font-size: .92em; }
.frac > .fn { border-bottom: 1px solid currentColor; padding: 0 .25em .05em; }
.frac > .fd { padding: .05em .25em 0; }
.c-m { color: var(--cm); font-weight: 600; }
.c-p { color: var(--cp); font-weight: 600; }
.c-b { color: var(--cb); font-weight: 600; }
.c-fg { color: var(--fg); font-weight: 600; }
.formula { background: var(--win); border: 1px solid var(--line); border-radius: 4px; padding: 14px 12px; text-align: center; overflow-x: auto; }

/* ---------- composants Breeze ---------- */
.card { background: var(--view); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow); }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; min-height: 32px; border: 1px solid var(--line2); background: var(--btn); border-radius: 4px; cursor: pointer; line-height: 1.3; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.btn.primary { background: var(--accent-soft); border-color: var(--accent); }
.btn.primary:hover:not(:disabled) { background: var(--accent-soft2); }
.btn[aria-pressed="true"] { background: var(--accent-soft2); border-color: var(--accent); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--fg2); }
.btn.ghost:hover { color: var(--fg); background: var(--accent-soft); border-color: transparent; }
.btn.small { min-height: 28px; padding: 3px 10px; font-size: .86rem; }
.btn:disabled { opacity: .45; cursor: default; }
.icon-btn { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 4px; border: 1px solid transparent; background: none; cursor: pointer; color: var(--fg2); vertical-align: middle; }
.icon-btn:hover { border-color: var(--line2); color: var(--fg); }
.icon-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
.msg { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border: 1px solid; border-radius: 4px; }
.msg-ic { width: 16px; height: 16px; flex: none; margin-top: 3px; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.msg-body { min-width: 0; }
.msg-ok { border-color: var(--pos); background: var(--pos-soft); } .msg-ok .msg-ic { stroke: var(--pos-ink); } .msg-ok strong { color: var(--pos-ink); }
.msg-bad { border-color: var(--neg); background: var(--neg-soft); } .msg-bad .msg-ic { stroke: var(--neg-ink); } .msg-bad strong { color: var(--neg-ink); }
.msg-warn { border-color: var(--warn); background: var(--warn-soft); } .msg-warn .msg-ic { stroke: var(--warn-ink); }
.msg-info { border-color: var(--accent); background: var(--accent-soft); } .msg-info .msg-ic { stroke: var(--accent-ink); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: thin; }
.tab { flex: none; padding: 8px 14px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--fg2); cursor: pointer; display: flex; align-items: center; gap: 8px; margin-bottom: -1px; }
.tab:hover { color: var(--fg); background: var(--accent-soft); }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tabs-s .tab { padding: 6px 12px; font-size: .9rem; }
.tab-n { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line2); font-size: .75rem; }
.tab[aria-selected="true"] .tab-n { border-color: var(--accent); background: var(--accent-soft2); }
.bar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; min-width: 60px; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 2px; transition: width .3s; }
.pill { font-size: .75rem; padding: 1px 8px; border-radius: 10px; border: 1px solid var(--line2); color: var(--fg2); }
.pill.done { border-color: var(--pos); color: var(--pos-ink); background: var(--pos-soft); }
.pill.next { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft); }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: .9rem; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.sw { width: 34px; height: 18px; border-radius: 9px; border: 1px solid var(--line2); background: var(--btn); position: relative; transition: background .15s; }
.sw i { position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--fg2); transition: transform .15s; }
.switch input:checked + .sw { background: var(--accent); border-color: var(--accent); }
.switch input:checked + .sw i { transform: translateX(16px); background: #fff; }
.switch input:focus-visible + .sw { box-shadow: 0 0 0 2px var(--accent); }
.inp { font: 15px var(--mono); padding: 3px 4px; min-height: 30px; border: 1px solid var(--line2); border-radius: 3px; background: var(--view); color: var(--fg); text-align: center; vertical-align: middle; }
.inp:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.inp.bad { border-color: var(--neg); background: var(--neg-soft); }
.inp.good { border-color: var(--pos); background: var(--pos-soft); }
.search { width: 100%; max-width: 420px; font: inherit; padding: 6px 10px; border: 1px solid var(--line2); border-radius: 4px; background: var(--view); color: var(--fg); }
.search:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.tscroll { overflow-x: auto; max-width: 100%; }
.lvl { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; color: var(--fg2); }
.lvl-bars { display: inline-flex; gap: 2px; align-items: flex-end; }
.lvl-bars i { width: 4px; border-radius: 1px; background: var(--line2); }
.lvl-bars i:nth-child(1) { height: 6px; } .lvl-bars i:nth-child(2) { height: 9px; } .lvl-bars i:nth-child(3) { height: 12px; }
.lvl-bars i.on { background: var(--fg2); }

/* ---------- repère ---------- */
.plane { width: 100%; max-width: 360px; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
.plane.interactive { cursor: crosshair; }
.pbg { fill: var(--pbg); stroke: var(--line); }
.g1 { stroke: var(--grid); stroke-width: 1; }
.g2 { stroke: var(--grid2); stroke-width: 1; }
.axis { stroke: var(--axis); stroke-width: 1.3; }
.axis-head { fill: var(--axis); }
.axl { font: italic 13px var(--math); fill: var(--fg2); }
.tick { font: 10px var(--ui); fill: var(--fg2); }
.ln { stroke-width: 2.4; stroke-linecap: round; }
.ln-main { stroke: var(--accent); }
.ln-try { stroke: var(--fg2); stroke-dasharray: 6 5; stroke-width: 1.6; }
.ln-ok { stroke: var(--pos); }
.tri { stroke: var(--cm); stroke-width: 1.8; stroke-dasharray: 5 4; }
.tril { font: 600 11px var(--ui); fill: var(--cm); paint-order: stroke; stroke: var(--pbg); stroke-width: 3px; }
.plabel { font: 600 12px var(--ui); paint-order: stroke; stroke: var(--pbg); stroke-width: 3px; }
.dpt { cursor: grab; outline: none; }
.dpt .hit { fill: transparent; }
.dpt .ring { fill: none; stroke-width: 1.5; opacity: .45; }
.dpt:focus-visible .ring { opacity: 1; stroke-width: 2.5; }
.dpt:hover .ring { opacity: .9; }

/* ---------- notions ---------- */
.notion { padding: 22px; display: flex; flex-direction: column; gap: 22px; }
.notion-h { display: flex; flex-direction: column; gap: 4px; }
.notion-h h2 { font-size: 1.35rem; }
.notion-f { border-top: 1px solid var(--line); padding-top: 16px; }
.nblock { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.nblock > p { max-width: 70ch; }
.nb-k { font-size: .76rem; text-transform: uppercase; letter-spacing: .07em; color: var(--fg2); font-weight: 600; }
.kt { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.keep { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
@media (max-width: 760px) { .kt { grid-template-columns: 1fr; } .notion { padding: 16px; } }
.lab { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; border: 1px solid var(--line); border-radius: 4px; padding: 16px; background: var(--win); }
@media (max-width: 820px) { .lab { grid-template-columns: 1fr; } }
.lab-fig { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.lab-panel { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.lab-panel .formula { background: var(--view); }
.calc-row { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.calc-k { font-size: .8rem; color: var(--fg2); }
.calc-v { min-width: 0; }
.steps-c { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.steps-c li { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.sc-k { font-size: .8rem; color: var(--fg2); display: block; }
.slider { display: flex; flex-direction: column; gap: 4px; }
.slider label { display: flex; align-items: center; gap: 6px; font-size: .9rem; }
.slider-val { margin-left: auto; font-family: var(--math); font-size: 1.05rem; min-width: 3em; text-align: right; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.read { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-size: .94rem; }
.spins { display: flex; flex-wrap: wrap; gap: 10px 16px; }
.spin { display: flex; flex-direction: column; gap: 3px; }
.spin label { font-size: .9rem; }
.spin-box { display: inline-flex; border: 1px solid var(--line2); border-radius: 4px; overflow: hidden; background: var(--view); }
.spin-b { width: 30px; border: 0; background: var(--btn); cursor: pointer; font-size: 1rem; }
.spin-b:hover { background: var(--accent-soft); }
.spin-i { width: 3.2em; border: 0; border-left: 1px solid var(--line); border-right: 1px solid var(--line); text-align: center; font: 15px var(--mono); background: var(--view); color: var(--fg); }
.spin-i:focus { outline: none; box-shadow: inset 0 0 0 1px var(--accent); }
.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: .92rem; }
.checks li { padding-left: 24px; position: relative; }
.checks li::before { position: absolute; left: 0; top: 1px; width: 17px; height: 17px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; }
.checks li.ok::before { content: "✓"; color: var(--pos-ink); border: 1px solid var(--pos); background: var(--pos-soft); }
.checks li.no::before { content: "✕"; color: var(--neg-ink); border: 1px solid var(--neg); background: var(--neg-soft); }
.cover { display: flex; flex-direction: column; gap: 8px; }
.cover > div { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; background: var(--view); border: 1px solid var(--line); border-radius: 4px; }
.lang { display: flex; flex-direction: column; gap: 3px; padding: 10px 12px; background: var(--view); border: 1px solid var(--line); border-radius: 4px; }
.lang-k { font-size: .8rem; color: var(--fg2); }
.types { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 560px) { .types { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.type { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--win); }
.type .plane { max-width: 110px; }
.type figcaption { display: flex; flex-direction: column; align-items: center; font-size: .86rem; line-height: 1.35; text-align: center; }
.kit { border-collapse: collapse; width: 100%; min-width: 620px; font-size: .92rem; }
.kit th, .kit td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
.kit thead th { background: var(--header); font-weight: 600; }
.kit tbody th { background: var(--win); font-weight: 600; color: var(--fg2); white-space: nowrap; }

/* ---------- exercices ---------- */
.fam-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.fam-card { display: flex; flex-direction: column; gap: 4px; padding: 14px; text-align: left; cursor: pointer; }
.fam-card:hover { border-color: var(--accent); }
.fam-card-t { font-weight: 600; line-height: 1.3; }
.fam-card-p { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: .82rem; color: var(--fg2); }
.fam-card-p .bar { flex: 1; }
.fam { display: flex; flex-direction: column; gap: 14px; scroll-margin-top: 110px; }
.fam-top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.fam-title { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 2px; }
.fam-title h2 { font-size: 1.3rem; }
.fam-prog { display: flex; flex-direction: column; gap: 4px; font-size: .82rem; color: var(--fg2); min-width: 120px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-width: 36px; height: 32px; padding: 0 10px; border-radius: 4px; border: 1px solid var(--line2); background: var(--btn); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; font-size: .9rem; }
.chip:hover { border-color: var(--accent); }
.chip.cur { background: var(--accent-soft2); border-color: var(--accent); }
.chip.ok { border-color: var(--pos); color: var(--pos-ink); }
.chip.ok.cur { background: var(--pos-soft); }
.chip-lv { font-size: .9rem; letter-spacing: -1px; color: var(--fg2); line-height: 1; }
.ex { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
@media (max-width: 560px) { .ex { padding: 14px; } }
.ex-h { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.ex-n { font-weight: 600; }
.done-chip { margin-left: auto; font-size: .76rem; padding: 1px 8px; border-radius: 10px; border: 1px solid var(--pos); color: var(--pos-ink); background: var(--pos-soft); }
